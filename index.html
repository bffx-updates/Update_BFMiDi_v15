      if (/failed to open serial port|invalidstateerror|networkerror|access denied|em uso|busy|already open/.test(low)) return ["A porta USB está em uso por outro programa.", "Feche o editor BFMiDi (aba ou app), feche outras páginas que usem a porta e tente de novo."];
      if (err && err.wrongDevice) return ["A porta escolhida não é a do USB Host.", m + ". Escolha a porta que apareceu DEPOIS de ligar o cabo na HOST; a porta DEVICE continua sendo a da controladora."];
      if (err && err.hostNoSync) return ["O USB Host não respondeu em modo de gravação.", m + ". Confira o cabo na porta HOST (sem hub) e tente de novo. Se a BFMiDi foi desligada no meio, ligue de novo e repita."];
      if (err && err.hostNoMode) return ["O USB Host não entrou em modo de gravação.", m + ". Desligue e ligue a controladora e tente de novo."];
      if (/chip não suportado|chip nao suportado/.test(low)) return ["Este chip não é de uma controladora BFMiDi.", m];
      if (/arquivo não encontrado|http 404|não encontrado/.test(low)) return ["Faltou um arquivo da atualização no servidor.", m + ". Tente mais tarde — se continuar, avise a BFX."];
      if (/sha-256|tamanho diferente|corrompido|integridade/.test(low)) return ["O download chegou incompleto ou corrompido.", m + ". Verifique a internet e tente de novo."];
      if (/pedal nao respondeu|não respondeu ao ping/.test(low)) return ["A controladora não respondeu pela porta.", "Confira se é a BFMiDi na janela de portas (e não outro aparelho) e tente de novo."];
      return ["Não foi possível concluir.", m];
    }

    function screenError(err) {
      S.lastError = err;
      S.eraseOnce = false;
      setMode("error");
      const [head, hint] = friendlyError(err);
      showArt(S.hostFailed ? "hostFail" : "fail");
      els.logwrap.open = true;
      setCopy({
        title: "Algo deu <em>errado</em>",
        desc: esc(head),
        extra: `<div class="errbox">${esc(hint)}<br/><code>${esc(String(err && err.message || err || ""))}</code></div>` +
          (S.pendingBackup ? `<p class="note">Seus dados foram guardados e podem ser baixados pelo botão abaixo.</p>` : ""),
        caption: "O registro técnico, no pé da página, ajuda o suporte.", icon: "warn",
      });
      setActions([
        { label: "Tentar de novo", icon: "refresh", onClick: () => retryAfterError() },
        S.pendingBackup ? { label: "Baixar o backup", kind: "ghost", icon: "download", onClick: () => AB.downloadBackup(S.pendingBackup) } : null,
        // a controladora já está pronta: o host pode ficar pra depois
        S.hostFailed ? { label: "Seguir sem o USB Host", kind: "link", icon: "swap", onClick: () => { S.hostFailed = false; S.busy = false; S.host.result = { outcome: "skipped" }; screenDone(); } } : null,
      ]);
    }

    // ══════════════════════════════════════════════════════════════════
    // PORTA SERIAL
    // ══════════════════════════════════════════════════════════════════
    const serialLib = () => navigator.serial || null;

    function portInfo(p) { try { return p.getInfo() || {}; } catch { return {}; } }
    function isBfPort(p) {
      const info = portInfo(p);
      return defaultFilters.some((f) => f.usbVendorId === info.usbVendorId && (!f.usbProductId || f.usbProductId === info.usbProductId));
    }
    function setDevice(p) {
      S.device = p;
      const info = portInfo(p);
      S.lastPortInfo = { usbVendorId: info.usbVendorId, usbProductId: info.usbProductId };
      log(`Porta: VID=0x${(info.usbVendorId || 0).toString(16)} PID=0x${(info.usbProductId || 0).toString(16)}${p.connected === false ? " [lembrada/offline]" : ""}`);
    }

    // Porta já autorizada e FISICAMENTE conectada (sem diálogo). Descarta
    // portas lembradas mas offline (fantasmas de sessões em bootloader) — sem
    // isto uma porta PID 0x0002 velha era auto-selecionada, isBootloader
    // virava true e o reset era pulado inteiro.
    // `afterReset` = procurando o ROM da controladora depois do reset: fora as
    // portas que já estavam lá antes (o USB Host em modo computador, por
    // exemplo) e as já recusadas; aí a preferência é pelo PID de download.
    // Fora do reset só a porta de APP (80C2) entra sozinha: uma porta de
    // bootloader solta pode ser o USB Host em modo computador (303A:1001), e
    // essa escolha fica com o usuário, na janela de portas.
    async function findGrantedPort(afterReset) {
      const lib = serialLib();
      if (!lib) return null;
      let matches = [];
      try { matches = (await lib.getPorts()).filter(isBfPort).filter((p) => !S.badPorts.has(p)); } catch (e) { log("getPorts falhou: " + e.message); return null; }
      if (afterReset) matches = matches.filter((p) => !S.beforePorts.includes(p));
      else matches = matches.filter((p) => !BOOTLOADER_PIDS.includes(portInfo(p).usbProductId));
      const live = matches.filter((p) => p.connected === true);
      if (live.length) matches = live;
      else if (matches.some((p) => p.connected === false)) return null;
      // Prefere a porta de APP; só cai num PID de download se for a única.
      const romFirst = afterReset ? -1 : 1;
      matches.sort((a, b) => romFirst * ((BOOTLOADER_PIDS.includes(portInfo(a).usbProductId) ? 1 : 0) - (BOOTLOADER_PIDS.includes(portInfo(b).usbProductId) ? 1 : 0)));
      return matches[0] || null;
    }

    async function requestPort(filters) {
      const lib = serialLib();
      try {
        return await lib.requestPort({ filters: filters || defaultFilters });
      } catch (err) {
        if (err.name === "NotFoundError") return null;   // o usuário fechou a janela
        throw err;
      }
    }

    async function waitForReconnect(timeoutMs) {
      const lib = serialLib();
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        const ports = await lib.getPorts();
        // nunca a porta que já estava lá antes do reset, nem uma já recusada
        // só uma porta de BOOTLOADER: a do app que não chegou a reiniciar não é "a porta nova"
        const cands = ports.filter((p) => portInfo(p).usbVendorId === 0x303a && BOOTLOADER_PIDS.includes(portInfo(p).usbProductId) && !S.beforePorts.includes(p) && !S.badPorts.has(p));
        const match = cands.find((p) => p.connected === true) || cands.find((p) => p.connected !== false);
        if (match) { setDevice(match); log("Reconectado na porta nova."); return match; }
        await sleep(250);
      }
      return null;
    }

    function wrapSignals(t) {
      const wrap = (fn) => async (val) => { try { return await fn.call(t, val); } catch (err) { log("Signal error: " + err.message); } };
      if (t && t.setDTR) t.setDTR = wrap(t.setDTR);
      if (t && t.setRTS) t.setRTS = wrap(t.setRTS);
      return t;
    }
    async function closeTransportSafe(t) {
      if (!t) return;
      try { await t.disconnect(); await (t.waitForUnlock && t.waitForUnlock(200)); } catch (e) { }
    }
    // Reset clássico por DTR/RTS (o USB CDC do arduino-esp32 o emula). É a
    // rede de segurança quando a cascata do canal de controle não pega.
    async function pulseBootMode(t) {
      log("Enviando sequência de boot (DTR/RTS)...");
      await t.setRTS?.(true); await t.setDTR?.(true); await sleep(100);
      await t.setRTS?.(false); await sleep(50);
      await t.setDTR?.(false); await sleep(50);
    }
    async function closeCtl() {
      if (S.ctl) { try { await S.ctl.close(); } catch (e) { } S.ctl = null; }
    }

    // ══════════════════════════════════════════════════════════════════
    // PASSO 1 → 2: conectar e identificar
    // ══════════════════════════════════════════════════════════════════
    async function connectFlow(fromClick) {
      if (S.busy) return;
      S.busy = true;
      try {
        // Depois de "Trocar de controladora" a janela de portas é obrigatória:
        // senão a mesma porta autorizada voltaria sozinha.
        let port = S.manualDisconnect ? null : await findGrantedPort();
        if (!port && fromClick) port = await requestPort();
        if (!port) { S.busy = false; return; }
        S.manualDisconnect = false;
        setDevice(port);
        await identify();
      } catch (err) {
        log("Falha ao conectar: " + err.message);
        screenError(err);
      } finally { S.busy = false; }
    }

    const freshHost = () => ({ has: false, version: "", seen: false, online: false, product: "", need: false, inRom: false, before: [], pkg: null, result: null, direct: false, recovering: false, pcMode: false });
    async function identify() {
      const pid = S.lastPortInfo && S.lastPortInfo.usbProductId;
      // `info` é a ficha DESTA identificação: se o cabo sair no meio, o handler
      // de disconnect troca S.info por null e o resto daqui é abandonado.
      const info = { board: "", chip: "", fw: "", webapp: "", id: "", mac: "", serial: "", bootloader: false, unidentified: false };
      S.info = info;
      S.host = freshHost();   // nada do USB Host da controladora ANTERIOR sobra (criaria um passo HOST fantasma)
      if (BOOTLOADER_PIDS.includes(pid)) {
        // Já em modo download: S2 = 0x0002; S3 = 0x0009 (OTG) / 0x1001 (JTAG).
        info.bootloader = true;
        info.chip = pid === 0x0002 ? "s2" : "s3";
        log("Controladora já em modo de gravação (PID 0x" + pid.toString(16) + ").");
        screenReady();
        return;
      }
      screenReading();
      let ctl = null;
      try {
        ctl = await AB.openControl(S.device, log);
      } catch (err) {
        if (S.info !== info) return;
        log("Canal de controle indisponível: " + err.message);
        info.unidentified = true;
        screenReady();
        return;
      }
      if (S.info !== info) { try { await ctl.close(); } catch { } return; }
      S.ctl = ctl;
      const tryCall = async (path, ms) => { try { return await ctl.call("GET", path, undefined, ms); } catch (e) { log(`${path}: ${e.message}`); return null; } };
      const v = await tryCall("/version", 5000);
      if (v && (v.fw || v.chip)) {
        info.fw = String(v.fw || ""); info.webapp = String(v.webapp || "");
        info.chip = String(v.chip || ""); info.board = String(v.board || "");
      }
      if (!info.board || !info.chip) {
        const g = await tryCall("/config/global", 5000);
        if (g) { if (g.board) info.board = String(g.board); if (g.chip && !info.chip) info.chip = String(g.chip); }
      }
      const ping = await tryCall("/ping", 3000);
      if (ping) { info.id = String(ping.device_id || ""); info.mac = String(ping.mac || ""); }
      const cert = await tryCall("/hardtest/cert", 3000);
      if (cert && cert.serial) info.serial = String(cert.serial);
      if (!/^s[23]$/.test(info.chip)) info.chip = "";
      info.legacy = !info.fw;
      // USB HOST: pede um status NOVO (a controladora manda o SysEx de pedido)
      // e lê o cache um instante depois — o host responde em milissegundos.
      S.host.has = modelHasUsbHost(info.board);
      if (S.host.has) {
        let st = await tryCall("/usb_host/status", 6000);
        if (st && !st.status_seen) { await sleep(900); st = (await tryCall("/usb_host/status?cached=1", 4000)) || st; }
        if (st && typeof st === "object" && !st.offline) {
          S.host.seen = !!st.status_seen; S.host.online = !!st.online;
          S.host.version = String(st.host_version || ""); S.host.product = String(st.product || "");
          S.host.pcMode = /Computador na porta HOST/i.test(S.host.product);
        }
        const want = S.hostManifest && S.hostManifest.version;
        S.host.need = S.host.seen && hostNeedsUpdate(S.host.version, want);
        log(`USB Host: ${S.host.seen ? (S.host.version || "sem versão") : "não respondeu"}${want ? ` · publicado ${want}` : ""}${S.host.need ? " · ATUALIZAR" : ""}`);
      }
      if (S.info !== info) { log("Identificação abandonada: a controladora saiu no meio."); return; }
      log(`Identificada: ${info.board || "(sem modelo)"} · chip ${info.chip || "?"} · fw ${info.fw || "(antigo)"} · editor ${info.webapp || "?"}` +
          (info.id ? ` · id ${info.id}` : "") + (info.serial ? ` · serial ${info.serial}` : ""));
      await sleep(350);   // deixa a animação de leitura aparecer
      if (S.info !== info) return;
      screenReady();
    }

    async function disconnectManual() {
      S.manualDisconnect = true;
      await closeCtl();
      S.device = null; S.lastPortInfo = null; S.info = null; S.host = freshHost();
      screenConnect();
    }

    // ══════════════════════════════════════════════════════════════════
    // DOWNLOAD + VERIFICAÇÃO (antes de encostar na controladora)
    // ══════════════════════════════════════════════════════════════════
    const binCache = new Map();   // "file|sha" → binary string
    async function sha256Hex(buf) {
      if (!(crypto && crypto.subtle)) return null;
      const h = await crypto.subtle.digest("SHA-256", buf);
      return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }
    function bufToBinaryString(buf) {
      const bytes = new Uint8Array(buf);
      let s = "";
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return s;
    }
    async function fetchBin(entry, onPct) {
      const key = (entry.base || "") + entry.file + "|" + (entry.sha256 || "");
      if (binCache.has(key)) return binCache.get(key);
      if (demo) { const s = await demo.fetchBin(entry, onPct); binCache.set(key, s); return s; }
      let lastErr = null;
      for (let attempt = 0; attempt < 4; attempt++) {
        if (attempt) await sleep(1000 * Math.pow(2, attempt - 1));
        try {
          const res = await fetch((entry.base || "./") + entry.file + "?t=" + Date.now(), { cache: "no-store" });
          if (res.status === 404) throw new Error("Arquivo não encontrado: " + entry.file);
          if (!res.ok) { lastErr = new Error("HTTP " + res.status + " em " + entry.file); continue; }
          const total = entry.size || +res.headers.get("content-length") || 0;
          const reader = res.body && res.body.getReader ? res.body.getReader() : null;
          let buf;
          if (reader) {
            const chunks = []; let got = 0;
            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              chunks.push(value); got += value.length;
              if (total && onPct) onPct(Math.min(99, Math.floor(got / total * 100)));
            }
            buf = new Uint8Array(got); let off = 0;
            for (const c of chunks) { buf.set(c, off); off += c.length; }
            buf = buf.buffer;
          } else {
            buf = await res.arrayBuffer();
          }
          if (entry.size && buf.byteLength !== entry.size) { lastErr = new Error(`tamanho diferente em ${entry.file} (${buf.byteLength} ≠ ${entry.size})`); continue; }
          if (entry.sha256) {
            const h = await sha256Hex(buf);
            if (h && h !== entry.sha256) { lastErr = new Error("SHA-256 não confere em " + entry.file); continue; }
          }
          const s = bufToBinaryString(buf);
          binCache.set(key, s);
          if (onPct) onPct(100);
          return s;
        } catch (e) {
          if (/não encontrado/.test(e.message)) throw e;
          lastErr = e;
        }
      }
      throw lastErr || new Error("falha no download de " + entry.file);
    }
    async function prefetchImages(chip, onProgress) {
      const list = flashListFor(chip);
      const total = list.reduce((a, f) => a + (f.size || 1), 0);
      let doneBytes = 0;
      for (const f of list) {
        const sz = f.size || 1;
        f.data = await fetchBin(f, (p) => onProgress(Math.floor((doneBytes + sz * p / 100) / total * 100)));
        doneBytes += sz;
        onProgress(Math.floor(doneBytes / total * 100));
      }
      S.images = list;
      S.flashSize = IMAGES_BY_CHIP[chip].flashSize;
      log(`Arquivos prontos: ${list.length} (${IMAGES_BY_CHIP[chip].label}, flash ${S.flashSize}).`);
    }

    // ══════════════════════════════════════════════════════════════════
    // PASSO 3: preparar (download → backup → modo de gravação → conectar)
    // ══════════════════════════════════════════════════════════════════
    const TASKS_PREP = (hasChip, backup) => [
      { k: "dl", label: "Baixar e conferir o firmware", skip: !hasChip },
      { k: "bk", label: "Guardar seus presets, imagens e ícones", skip: !backup },
      { k: "boot", label: "Reiniciar em modo de gravação" },
      { k: "con", label: "Conectar ao chip" },
    ];
    const TASKS_FLASH = (restore) => [
      { k: "fw", label: "Gravar o firmware" },
      { k: "app", label: "Gravar o editor (WebApp)" },
      { k: "rb", label: "Reiniciar a controladora" },
      { k: "rs", label: restore === "pack" ? "Aplicar o pacote de fábrica" : "Devolver seus dados", skip: !restore },
    ];

    function backupPhaseLabel(p) {
      return { presets: "presets", imagens: "imagens", icones: "ícones", aparelhos: "aparelhos personalizados" }[p.phase] || p.phase || "";
    }

    async function startUpdate(opts) {
      if (S.busy) return;
      S.busy = true;
      const info = S.info || {};
      // BACKUP DE UMA RODADA ANTERIOR que já tinha começado a gravar esta MESMA
      // unidade (mesmo id, ou a controladora ainda no ROM): vale mais que um
      // backup novo — a LittleFS pode ter ficado pela metade e o novo guardaria
      // a placa já sem dados.
      const keepOld = !!(S.pendingBackup && S.flashTouched && (info.bootloader || info.unidentified || (info.id && info.id === S.pendingBackupId)));
      if (keepOld) log("Usando o backup guardado antes da gravação que não terminou (mesma controladora).");
      else { S.pendingBackup = null; S.pendingBackupId = null; }
      S.backupStats = null; S.restoreStats = null; S.restoreWarn = null;
      S.flashTouched = false;
      const canBackup = !info.bootloader && !info.unidentified && !!S.ctl;
      const doBackup = canBackup && S.wantBackup && !keepOld;
      const chipKnown = /^s[23]$/.test(info.chip) ? info.chip : null;
      S.chipKey = chipKnown;
      // `opts.hostToo` = o botão da linha da controladora (só ela); sem ele vale
      // a opção "Atualizar também o USB Host". Chamado como handler de clique o
      // primeiro argumento é o evento, que não tem `hostToo`.
      const hostToo = (opts && typeof opts.hostToo === "boolean") ? opts.hostToo : S.wantHost;
      S.plan = { ctrl: true, host: !!(S.host.has && S.host.need && hostToo && S.hostManifest) };
      S.hostFailed = false; S.host.direct = false;
      setRail(S.plan.host ? ["connect", "identify", "prepare", "flash", "host", "done"] : ["connect", "identify", "prepare", "flash", "done"]);

      setStep("prepare"); setMode("prepare");
      setCopy({
        title: "Preparando a <em>atualização</em>",
        desc: doBackup ? "Baixo o firmware, guardo seus dados e só então a controladora reinicia em modo de gravação." : "Baixando o firmware e colocando a controladora em modo de gravação.",
        caption: "",
      });
      showTasks(TASKS_PREP(!!chipKnown, doBackup));
      setActions([]);

      try {
        // a) download + verificação, ANTES de encostar na controladora
        if (chipKnown) {
          task("dl", "active", 0);
          showArt("download");
          els.caption.textContent = `Baixando o firmware ${latestFor(chipKnown) || ""} para ${IMAGES_BY_CHIP[chipKnown].label}…`;
          await prefetchImages(chipKnown, (p) => task("dl", "active", p));
          task("dl", "done");
        }

        if (info.bootloader) {
          // Já está no ROM: pula backup e reset.
          task("boot", "done", "já estava");
          await connectEsptoolAndFlash();
          return;
        }

        // b) backup pelo canal já aberto
        if (doBackup) {
          task("bk", "active", 0);
          showArt("backup");
          els.caption.textContent = "Lendo os dados da controladora…";
          try {
            const { obj, stats } = await AB.extractBackup(S.ctl, {
              log, onProgress: (p) => {
                const pct = typeof p.pct === "number" ? p.pct : undefined;
                const kb = p.bytes ? ` (${(p.bytes / 1024).toFixed(0)} KB)` : "";
                els.caption.textContent = `Guardando ${backupPhaseLabel(p)}${kb}…`;
                task("bk", "active", pct);
              },
            });
            S.pendingBackup = obj; S.backupStats = stats; S.pendingBackupId = info.id || "";
            S.backupListed = stats.listed || [];
            await AB.stashBackup(obj);
            els.dl.hidden = false;
            log(`Backup: ${stats.presets} presets, ${stats.images} imagens, ${stats.icons} ícones, ${stats.userPedals} aparelhos.`);
            task("bk", "done", `${stats.presets} presets`);
            if (S.wantErase || S.eraseOnce) log("ATENÇÃO: 'Apagar memória' também apaga a NVS — placa, cores, brilho e Wi-Fi voltam ao padrão.");
          } catch (err) {
            log("Backup automático falhou: " + err.message);
            task("bk", "fail");
            const go = window.confirm(
              "Não foi possível guardar os dados desta controladora.\n\nMotivo: " + err.message +
              "\n\nSe continuar, a gravação vai APAGAR presets, imagens e ícones.\nCancele se preferir fazer o backup pelo editor antes.");
            if (!go) {
              log("Gravação cancelada pelo usuário (sem backup).");
              S.busy = false;
              screenReady();
              return;
            }
          }
        }

        // c) modo de gravação — cascata VERIFICADA do autobackup.js (pulso
        //    DTR/RTS na porta aberta → 1200 bps touch); só devolve true quando
        //    o USB re-enumerou. Em false, o Transport + pulseBootMode é a rede
        //    de segurança (sem isso o esptool morria em "Failed to connect").
        task("boot", "active");
        showArt("reboot");
        els.caption.textContent = "A tela apaga por um instante: é o reinício em modo de gravação.";
        try { S.beforePorts = (await serialLib().getPorts()).filter((p) => p !== S.device && p.connected === true); } catch { S.beforePorts = []; }
        let resetOk = false;
        if (S.ctl) {
          try { resetOk = await S.ctl.resetToBootloader(); } catch (e) { log("resetToBootloader: " + e.message); }
          S.ctl = null;
        }
        if (!resetOk) {
          log("Reset pelo canal de controle não pegou — tentando pelo esptool.");
          let pre = null;
          try {
            pre = wrapSignals(new Transport(S.device, true));
            await pre.connect(115200);
            await pulseBootMode(pre);
          } catch (e) { log("Boot pulse warning: " + e.message); }
          finally { await closeTransportSafe(pre); }
        }
        log("Aguardando re-enumeração USB...");
        await sleep(2000);
        const re = await waitForReconnect(3000);
        if (!re) {
          // S2 troca de PID ao entrar no bootloader: o navegador precisa de
          // uma nova autorização do usuário (um clique).
          log("Porta nova ainda não autorizada — pedindo ao usuário.");
          S.device = null; S.lastPortInfo = null;
          S.busy = false;
          screenAwaitPort();
          return;
        }
        task("boot", "done");
        await connectEsptoolAndFlash();
      } catch (err) {
        if (err && err.wrongDevice) return wrongPortRetry(err);
        log("Erro: " + err.message);
        if (err.stack) log(err.stack);
        await disconnectEsp();
        S.busy = false;
        screenError(err);
      }
    }

    // Volta do passo "autorize a porta" (clique do usuário) e da nova
    // tentativa depois de um erro com a controladora já no ROM.
    async function continueAfterReset(fromClick) {
      if (S.busy) return;
      S.busy = true;
      try {
        let port = await findGrantedPort(true);
        if (!port && fromClick) port = await requestPort();
        if (!port) { S.busy = false; screenAwaitPort(); return; }
        if (S.badPorts.has(port)) { S.busy = false; screenAwaitPort("Essa é a porta recusada há pouco (não é a controladora). Escolha a outra linha."); return; }
        setDevice(port);
        if (!BOOTLOADER_PIDS.includes(S.lastPortInfo.usbProductId)) {
          // A controladora voltou a rodar o app (a tela acendeu): o fluxo
          // recomeça pela identificação, sem gravar nada.
          log("A porta escolhida é a do app — recomeçando pela identificação.");
          S.busy = false;
          await identify();
          return;
        }
        setStep("prepare"); setMode("prepare");
        setCopy({ title: "Preparando a <em>atualização</em>", desc: "Porta autorizada. Conectando ao chip da controladora.", caption: "" });
        showTasks(TASKS_PREP(!!S.chipKey, false).map((t) => (t.k === "con" ? t : Object.assign(t, { skip: false }))));
        taskDoneUpTo("con");
        setActions([]);
        await connectEsptoolAndFlash();
      } catch (err) {
        if (err && err.wrongDevice) return wrongPortRetry(err);
        log("Erro: " + err.message);
        await disconnectEsp();
        S.busy = false;
        screenError(err);
      }
    }

    async function disconnectEsp() {
      try { if (S.transport) await S.transport.disconnect(); } catch (e) { }
      S.transport = null; S.esploader = null;
    }

    const espLoaderTerminal = { clean() { }, writeLine(d) { log(d); }, write(d) { log(d); } };

    // ══════════════════════════════════════════════════════════════════
    // esptool: conectar (com retry), identificar o chip, gravar, reiniciar
    // ══════════════════════════════════════════════════════════════════
    // A PORTA CERTA? O ROM da controladora S3 e o do USB HOST têm o mesmo
    // VID/PID, o mesmo nome no navegador e o mesmo CHIP_NAME; o que os separa
    // é a FLASH: controladora S3 = 16 MB (N16R8), USB Host = 4 MB, controladora
    // S2 = 4 MB num ESP32-S2. Sem confirmar, nada é gravado — o mapa da
    // controladora S3 no host escreveria bootloader e app errados antes de o
    // esptool tropeçar nos 4 MB. (O mesmo guard, invertido, protege o host:
    // assertIsHostChip.)
    async function assertIsControllerChip(loader, chipKey) {
      const kb = await readFlashSizeKb(loader);
      const want = chipKey === "s3" ? 16384 : 4096;
      if (!kb) { const e = new Error("não consegui confirmar a memória da controladora"); e.wrongDevice = true; e.nothingWritten = true; throw e; }
      if (kb !== want) {
        const e = new Error(chipKey === "s3" && kb === 4096
          ? "esta porta é o USB Host (ESP32-S3 de 4 MB), não a controladora"
          : `memória de ${kb / 1024} MB — a controladora ${chipKey === "s3" ? "S3 tem 16 MB" : "S2 tem 4 MB"}`);
        e.wrongDevice = true; e.nothingWritten = true; throw e;
      }
      log(`Flash confirmada: ${kb / 1024} MB (${IMAGES_BY_CHIP[chipKey].label}).`);
    }
    // Porta errada depois do reset: a controladora continua em modo de gravação
    // em OUTRA linha. Marca a porta recusada, volta ao passo da porta com o
    // motivo e deixa escolher de novo — sem tela de erro, sem gravar nada.
    async function wrongPortRetry(err) {
      log("Porta errada: " + err.message);
      if (S.device) S.badPorts.add(S.device);
      await disconnectEsp();
      S.device = null; S.lastPortInfo = null;
      S.busy = false; S.retryFromRom = true;
      screenAwaitPort("Essa porta não é a da controladora: " + err.message + ". Nada foi gravado. Escolha a outra linha.");
    }
    async function connectEsptoolAndFlash() {
      task("con", "active");
      showArt("boot");
      els.caption.textContent = "Conectando ao chip em modo de gravação…";
      log("Aguardando estabilização da porta...");
      await sleep(1000);

      let connected = false, lastError = null;
      const maxRetries = 3;
      for (let attempt = 1; attempt <= maxRetries && !connected; attempt++) {
        try {
          log(`Tentativa de conexão ${attempt}/${maxRetries}...`);
          if (S.transport) { await closeTransportSafe(S.transport); S.transport = null; S.esploader = null; await sleep(300); }
          S.transport = wrapSignals(new Transport(S.device, true));
          S.esploader = new ESPLoader({ transport: S.transport, baudrate: 115200, terminal: espLoaderTerminal, romBaudrate: 115200 });
          await S.esploader.main("no_reset");
          log("Conexão estabelecida.");

          // O esptool identifica o silício de verdade — é isto que decide o
          // conjunto de bins e os offsets (S2 × S3).
          let chipName = "";
          try { chipName = String(S.esploader.chip?.CHIP_NAME || ""); } catch (e) { }
          if (!/S[23]/.test(chipName)) {
            try { chipName = String(await S.esploader.chip.getChipDescription(S.esploader)); } catch (e) { log("getChipDescription falhou: " + e.message); }
          }
          log("Chip detectado: " + (chipName || "desconhecido"));
          const chipKey = chipName.includes("S3") ? "s3" : chipName.includes("S2") ? "s2" : null;
          if (!chipKey) { const e = new Error("Chip não suportado pelo atualizador: " + (chipName || "desconhecido")); e.noRetry = true; throw e; }
          // A identificação pelo cabo disse OUTRO chip? Então esta porta é
          // outra placa (a controladora de verdade continua em outra linha).
          if (S.info && !S.info.bootloader && /^s[23]$/.test(S.info.chip) && S.info.chip !== chipKey) {
            const e = new Error(`o chip desta porta é ${chipKey.toUpperCase()}, mas a controladora identificada é ${S.info.chip.toUpperCase()}`);
            e.wrongDevice = true; e.nothingWritten = true; throw e;
          }
          await assertIsControllerChip(S.esploader, chipKey);
          S.chipKey = chipKey;
          if (S.info) S.info.chip = chipKey;
          connected = true;   // só com o chip conferido: antes, um chip recusado deixava o laço "conectado" sem loader
        } catch (err) {
          lastError = err;
          await closeTransportSafe(S.transport); S.transport = null; S.esploader = null;
          if (err && (err.wrongDevice || err.noRetry)) throw err;   // porta errada / chip errado não se resolvem tentando de novo
          log(`Tentativa ${attempt} falhou: ${err.message}`);
          if (attempt < maxRetries) { log("Aguardando antes de nova tentativa..."); await sleep(1000 * attempt); }
        }
      }
      if (!connected) { S.retryFromRom = true; throw lastError || new Error("Falha ao conectar após múltiplas tentativas"); }
      task("con", "done");
      S.retryFromRom = true;   // daqui em diante a controladora está no ROM: qualquer falha (até no download) volta pela porta do bootloader

      // Bins deste chip (se o download não aconteceu antes, acontece agora).
      if (!S.images || !S.images.length || !S.images[0].file.startsWith(S.chipKey === "s3" ? "bin_S3" : "bin_S2")) {
        task("dl", "active", 0);
        showArt("download");
        els.caption.textContent = `Baixando o firmware para ${IMAGES_BY_CHIP[S.chipKey].label}…`;
        await prefetchImages(S.chipKey, (p) => task("dl", "active", p));
        task("dl", "done");
      }
      await flashNow();
    }

    async function flashNow() {
      const esploader = S.esploader;
      const images = S.images;
      const restoreKind = S.pendingBackup ? "backup" : (AB.defaultPackFor(S.info && S.info.board, S.chipKey) ? "pack" : null);

      setStep("flash"); setMode("flash");
      setCopy({
        title: "Gravando o <em>firmware</em>",
        desc: "Firmware e editor entrando. Mantenha o cabo conectado e não feche esta aba.",
        caption: "Tela da controladora parada ou apagada é normal.",
      });
      showTasks(TASKS_FLASH(restoreKind));
      setActions([]);
      showRing("fw", "FIRMWARE", "preparando…");

      try {
        const shouldEraseAll = !!S.wantErase || !!S.eraseOnce;
        S.eraseOnce = false;   // o pedido das Ferramentas vale só pra esta gravação
        const canEraseBeforeWrite = typeof esploader.eraseFlash === "function";
        if (shouldEraseAll) {
          setRing(0, "wait", "APAGANDO", "toda a memória");
          log("Iniciando Erase All Flash...");
          if (canEraseBeforeWrite) {
            try { await esploader.eraseFlash(); log("Erase All Flash concluído."); }
            catch (eraseErr) {
              log("Aviso no Erase Flash: " + eraseErr.message);
              if (/timeout|disconnect/i.test(eraseErr.message)) throw eraseErr;
              log("Continuando com a gravação...");
            }
          }
          await sleep(500);
        }

        const fileArray = images.map((img) => ({ data: img.data, address: img.address }));
        log(`Total: ${fileArray.length} arquivos, ${fileArray.reduce((a, f) => a + f.data.length, 0)} bytes`);
        task("fw", "active", 0);
        S.flashTouched = true;   // a partir daqui a flash pode ficar pela metade: o backup desta rodada vale numa nova tentativa

        const useEraseInWrite = shouldEraseAll && !canEraseBeforeWrite;
        await esploader.writeFlash({
          fileArray,
          eraseAll: useEraseInWrite,
          compress: true,
          flashSize: S.flashSize,
          reportProgress: (idx, written, total) => {
            // Duas fases: bootloader/partitions/firmware(/otadata) = FIRMWARE;
            // littlefs.bin = EDITOR. O contador reinicia em cada arquivo.
            const isApp = images[idx] && /littlefs\.bin$/.test(images[idx].file);
            const percent = Math.floor((written / total) * 100);
            if (isApp) { task("fw", "done"); task("app", "active", percent); setRing(percent, "app", "EDITOR", "WebApp e presets de fábrica"); }
            else { task("fw", "active", percent); setRing(percent, "fw", "FIRMWARE", images[idx] ? images[idx].file.split("/").pop() : ""); }
          },
          calculateMD5Hash: (typeof CryptoJS !== "undefined") ? (image) => CryptoJS.MD5(CryptoJS.enc.Latin1.parse(image)) : undefined,
        });
        log("Gravação concluída, finalizando...");
        task("fw", "done"); task("app", "done");

        // Reinício: S3 pelo override do esptool oficial (limpa FORCE_DOWNLOAD_BOOT
        // + watchdog RTC) — o reset genérico por RTS pode deixá-lo parado no
        // ROM, e sem boot não há canal CDC pra devolver o backup. S2: fluxo
        // original validado (after + hardReset).
        task("rb", "active");
        setRing(100, "wait", "REINICIANDO", "a controladora liga sozinha");
        showArt("reboot");
        els.caption.textContent = "A tela apaga e volta com o firmware novo.";
        try {
          if (S.chipKey === "s3") {
            try { await resetS3ByWatchdog(esploader); }
            catch (e) { log("Watchdog S3 falhou (" + e.message + ") — reset padrão."); await esploader.after("hard_reset"); }
          } else {
            try { await esploader.after(); } catch (afterErr) { log("Aviso no after(): " + afterErr.message); }
            await esploader.hardReset();
          }
        } catch (e) { log("Reset enviado (dispositivo pode ter desconectado)"); }
        await disconnectEsp();
        task("rb", "done");

        if (restoreKind) await restoreAfterFlash(restoreKind);
        S.flashTouched = false;
        log("=== CONTROLADORA ATUALIZADA ===");
        if (S.plan.host) {
          await hostStage();          // nunca lança: o resultado vai em S.host.result
          if (S.hostFailed) return;   // a tela de erro do host já está no ar
        }
        S.busy = false;
        screenDone();
      } catch (err) {
        log("ERRO FATAL: " + err.message);
        if (err.stack) log(err.stack);
        await disconnectEsp();
        S.retryFromRom = true;
        S.busy = false;
        screenError(err);
      }
    }

    async function resetS3ByWatchdog(loader) {
      const RTC_CNTL_OPTION1_REG = 0x6000812c, RTC_CNTL_FORCE_DOWNLOAD_BOOT_MASK = 0x1;
      const RTC_CNTL_WDTCONFIG0_REG = 0x60008098, RTC_CNTL_WDTCONFIG1_REG = 0x6000809c;
      const RTC_CNTL_WDTWPROTECT_REG = 0x600080b0, RTC_CNTL_WDT_WKEY = 0x50d83aa1;
      await loader.writeReg(RTC_CNTL_OPTION1_REG, 0, RTC_CNTL_FORCE_DOWNLOAD_BOOT_MASK);
      await loader.writeReg(RTC_CNTL_WDTWPROTECT_REG, RTC_CNTL_WDT_WKEY);
      await loader.writeReg(RTC_CNTL_WDTCONFIG1_REG, 2000);
      try { await loader.writeReg(RTC_CNTL_WDTCONFIG0_REG, 0xd0000102); }
      catch (e) { await sleep(700); return; }   // o watchdog reiniciou antes da resposta USB
      try { await loader.writeReg(RTC_CNTL_WDTWPROTECT_REG, 0); } catch (e) { }
      await sleep(700);
    }

    // Devolve ao pedal o backup do usuário ou, sem backup, o pacote de fábrica
    // do display dele (regra em autobackup.js, defaultPackFor). Nunca derruba
    // a atualização: falha → o backup é BAIXADO pro usuário restaurar.
    async function restoreAfterFlash(kind) {
      setMode("restore");
      task("rs", "active", 0);
      showArt("restore");
      setCopy({
        title: kind === "pack" ? "Aplicando o <em>pacote de fábrica</em>" : "Devolvendo seus <em>dados</em>",
        desc: kind === "pack" ? "Gravando os presets e imagens de fábrica do seu display." : "Presets, imagens e ícones voltando pro lugar.",
        caption: "Esperando a controladora ligar…",
      });
      let ctl = null;
      try {
        let payload = S.pendingBackup;
        if (kind === "pack") {
          const url = AB.defaultPackFor(S.info && S.info.board, S.chipKey);
          log("Sem backup — aplicando o pacote de fábrica " + url);
          const r = await fetch(url);
          if (!r.ok) throw new Error("pacote não encontrado (" + url + ")");
          payload = await r.json();
          if (!payload || !payload.presets) throw new Error("pacote de fábrica inválido");
        }
        const appPort = await AB.waitForAppPort(0x303a, 25000, S.beforePorts);   // nunca outra BFMiDi que já estava no PC
        if (!appPort) throw new Error("a controladora não reapareceu como BFMiDi (PID 80C2)");
        await sleep(1500);   // o firmware termina o boot antes do PING
        // boot mais lento: três tentativas de abrir o canal antes de desistir da devolução
        let openErr = null;
        for (let a = 1; a <= 3 && !ctl; a++) {
          try { ctl = await AB.openControl(appPort, log); }
          catch (e) { openErr = e; log(`canal pra devolução: tentativa ${a} falhou (${e.message})`); await sleep(2000); }
        }
        if (!ctl) throw openErr;
        // ESPELHA a mídia: o que o pedal tem (o pacote de fábrica assado na
        // imagem) e o backup não tem é apagado antes dos uploads, senão as
        // sobras comem a cota e os ícones, que entram por último, não cabem.
        // Só as categorias lidas na extração; o pacote de fábrica é completo.
        const prune = kind === "pack" ? ["img", "icon"] : (S.backupListed || []);
        const stats = await AB.injectBackup(ctl, payload, {
          log, prune, onProgress: (p) => {
            const pct = typeof p.pct === "number" ? p.pct : 0;
            task("rs", "active", pct);
            els.caption.textContent = `Gravando ${backupPhaseLabel(p)}…`;
          },
        });
        log(`Restaurado: ${stats.presets} presets, ${stats.images} imagens, ${stats.icons} ícones, ${stats.userPedals} aparelhos` + (stats.pruned ? ` (${stats.pruned} slot(s) de fábrica apagados antes)` : "") + ".");
        if (stats.failed.length) {
          log("Não coube / falhou: " + stats.failed.join(", "));
          S.restoreWarn = "Nem tudo coube de volta (" + stats.failed.join(", ") + ").";
          if (S.pendingBackup) AB.downloadBackup(S.pendingBackup);
        } else if (S.pendingBackup) {
          await AB.clearStashedBackup();
        }
        if (kind === "backup") S.restoreStats = stats;
        task("rs", "done");
      } catch (err) {
        log("Falha ao devolver os dados: " + err.message);
        task("rs", "fail");
        if (S.pendingBackup) {
          S.restoreWarn = "A atualização terminou, mas os dados não puderam ser devolvidos automaticamente (" + err.message + ").";
          AB.downloadBackup(S.pendingBackup);
        } else {
          S.restoreWarn = "O pacote de fábrica não foi aplicado (" + err.message + "). Baixe o Start Pack nesta página e restaure pelo editor.";
        }
      } finally {
        try { if (ctl) await ctl.close(); } catch (e) { }
      }
    }


    // ══════════════════════════════════════════════════════════════════
    // PASSO USB HOST — o módulo ESP32-S3 de 4 MB dentro das BFMiDi 3 e S3
    // ══════════════════════════════════════════════════════════════════
    // Porte do caminho DO USUÁRIO do editor (aba HOST do card ATUALIZAÇÃO:
    // webApp/host_flash.js + components/hostupdatewizard.jsx). A controladora
    // continua no cabo DEVICE e é por ele (o canal CDC) que saem o comando de
    // modo download e a conferência da versão no fim; quem recebe os bins é um
    // SEGUNDO cabo do computador na porta HOST. A ponte UART pela controladora
    // (runHostFlashViaController) ficou de fora de propósito: gravava o host
    // na mesma rodada da controladora e, parando no meio, deixava hosts
    // truncados em campo (decisão de out/2026).
    function hostPortKind(p) {
      const info = portInfo(p);
      if (info.usbVendorId !== 0x303a) return "";
      if (HOST_ROM_PIDS.includes(info.usbProductId)) return "rom";
      if (info.usbProductId === HOST_UPDATE_PID) return "update";
      if (info.usbProductId === 0x80c2 || info.usbProductId === 0x0002) return "controller";
      return "";
    }
    async function hostConnectedPorts() {
      let ports = [];
      try { ports = await serialLib().getPorts(); } catch { return []; }
      return ports.filter((p) => p.connected === true && p !== S.device && !S.badPorts.has(p) && ["rom", "update"].includes(hostPortKind(p)));
    }
    // Nunca escolhe a primeira porta de uma lista ambígua: numa rodada nova só
    // a identidade que surgiu DEPOIS do comando é autodetectada; na retomada
    // (host já no ROM) uma única porta autorizada pode ser reusada.
    function chooseHostPort(ports, recovering) {
      const fresh = ports.filter((p) => !S.host.before.includes(p));
      const eligible = recovering ? ports : fresh;
      if (eligible.length === 1) return { port: eligible[0], reason: "" };
      return { port: null, reason: eligible.length > 1 ? "multiple" : ports.length ? "unidentified" : "" };
    }
    async function waitHostPort(timeoutMs, recovering) {
      const deadline = Date.now() + timeoutMs;
      for (;;) {
        const m = chooseHostPort(await hostConnectedPorts(), recovering);
        if (m.port) return m.port;
        if (m.reason) { log("porta do host: seleção manual (" + m.reason + ")"); return null; }
        if (Date.now() >= deadline) return null;
        await sleep(400);
      }
    }
    async function portWentAway(port, timeoutMs) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) {
        if (port.connected === false) return true;
        try { if (!(await serialLib().getPorts()).includes(port)) return true; } catch { }
        await sleep(200);
      }
      return false;
    }
    // LEITURA SEM PERDA (porte do esp_flash.js do editor): o readLoop do
    // esptool-js abandona um reader.read() quando o timeout ganha, e o próximo
    // pedaço vai pra leitura abandonada. Aqui a leitura pendente é guardada e
    // reaproveitada na volta seguinte. Só no transporte do HOST: o da
    // controladora fica como foi validado no pedal.
    function fixReadLoop(t) {
      if (!t || typeof t.readLoop !== "function" || t._bfReadLoopFixed) return t;
      t._bfReadLoopFixed = true;
      t.readLoop = async function* readLoop(timeout) {
        if (!this.reader) return;
        try {
          for (;;) {
            if (!this._bfRead || this._bfReadOf !== this.reader) { this._bfRead = this.reader.read(); this._bfReadOf = this.reader; }
            let timer = null;
            const expired = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("Read timeout exceeded")), timeout); });
            let r;
            try { r = await Promise.race([this._bfRead, expired]); } finally { clearTimeout(timer); }
            this._bfRead = null;
            if (r === null) break;
            const { value, done } = r;
            if (done || !value) break;
            yield value;
          }
        } catch { /* tempo esgotado: a leitura pendente fica pra próxima volta */ }
        finally { this.buffer = new Uint8Array(0); }
      };
      return t;
    }

    // Canal CDC com a controladora pro passo do host: o que ficou aberto da
    // identificação, ou um novo depois que ela reiniciou com o firmware novo.
    async function ensureCtl() {
      if (S.ctl) { try { await S.ctl.send("PING", 2500); return S.ctl; } catch { S.ctl = null; } }
      let lastErr = null;
      for (let a = 1; a <= 3; a++) {
        try {
          const appPort = await AB.waitForAppPort(0x303a, 25000, S.beforePorts);
          if (!appPort) throw new Error("a controladora não reapareceu como BFMiDi (PID 80C2)");
          await sleep(1500);
          setDevice(appPort);
          S.ctl = await AB.openControl(appPort, log);
          return S.ctl;
        } catch (e) { lastErr = e; log("canal com a controladora: " + e.message); await sleep(2000); }
      }
      throw lastErr;
    }
    async function hostStatus(fresh) {
      if (!S.ctl) return null;
      try { return await S.ctl.call("GET", fresh ? "/usb_host/status" : "/usb_host/status?cached=1", undefined, 6000); }
      catch (e) { return null; }
    }
    // O host responde AGORA? Pedido novo + leitura do cache 0,8 s depois; só
    // vale um quadro com menos de 1,5 s (o `online` sozinho é validade de 3 s).
    async function hostAnswerStatus() {
      await hostStatus(true); await sleep(800);
      const st = await hostStatus(false);
      if (!st || st.offline) return null;
      if (!("last_seen_ms" in st)) return st.online ? st : null;
      return (st.online && Number(st.last_seen_ms) < 1500) ? st : null;
    }
    async function waitHostAnswering(timeoutMs) {
      const deadline = Date.now() + timeoutMs;
      while (Date.now() < deadline) { if (await hostAnswerStatus()) return hostStatus(false); await sleep(700); }
      return null;
    }
    const statusIsUpdateMode = (st) => !!st && (String(st.product || "") === "USB Host Update" || /Modo update TinyUSB/i.test(String(st.status_text || "")));

    // MODO DOWNLOAD pelo cabo DEVICE: SysEx update_mode SEM alvo (persistência
    // USB-OTG) — o host reinicia no bootloader e aparece no PC pela porta HOST
    // como 303A:0009. Confirmação: (a) o ACK do comando = um quadro NOVO do
    // host depois do POST com last_ack 0 (o host só confirma depois de gravar
    // a flag na NVS); (b) depois, SILÊNCIO (dois pedidos novos sem resposta).
    // Host anterior ao 3.0 para no modo update (4002) e continua respondendo —
    // o próprio status dele diz. O `online` caindo sozinho não prova nada.
    async function enterHostRomForCable() {
      const frameAt = (st, at) => (st && st.protocol_ok !== false && Number.isFinite(Number(st.last_seen_ms))) ? at - Number(st.last_seen_ms) : 0;
      const before = await hostStatus(false);
      const baseAt = before ? frameAt(before, Date.now()) : Infinity;
      let r = null;
      try { r = await S.ctl.call("POST", "/usb_host/update_mode", "", 8000); }
      catch (e) { const err = new Error("a controladora não mandou o comando (" + e.message + ")"); err.hostNoMode = true; throw err; }
      if (!r || r.sent !== true) { const err = new Error("a controladora não aceitou o comando de modo de gravação"); err.hostNoMode = true; throw err; }
      let acked = false;
      const ackDeadline = Date.now() + 3000;
      while (Date.now() < ackDeadline) {
        await sleep(200);
        const t0 = Date.now();
        const st = await hostStatus(false);
        if (!st || !(frameAt(st, t0) > baseAt)) continue;
        if (statusIsUpdateMode(st)) return { ok: true, via: "update", acked: true };
        if (/Modo download ROM/i.test(String(st.status_text || ""))) return { ok: true, via: "rom", acked: true };
        const ack = Number(st.last_ack);
        if (ack === 0) { acked = true; break; }
        if (Number.isFinite(ack) && ack !== 255) return { ok: false, reason: "nack", ack };
      }
      await sleep(acked ? 2000 : 800);
      let quiet = 0;
      const deadline = Date.now() + 9000;
      while (Date.now() < deadline) {
        const st = await hostAnswerStatus();
        if (st) { if (statusIsUpdateMode(st)) return { ok: true, via: "update", acked }; quiet = 0; }
        else if (++quiet >= 2) return { ok: true, via: acked ? "rom" : "silent", acked };
        await sleep(1200);
      }
      return { ok: false, reason: "stillAnswering", acked };
    }

    // Hosts anteriores ao 3.0 param no firmware de MODO UPDATE (CDC 4002): a
    // linha "BOOT" os leva ao ROM, que aparece como OUTRA porta.
    async function sendBootCommand(port) {
      try { await port.open({ baudRate: 115200 }); } catch { return false; }
      let sent = false;
      try {
        try { await port.setSignals({ dataTerminalReady: true, requestToSend: false }); } catch { }
        await sleep(200);
        const w = port.writable.getWriter();
        try { await w.write(new TextEncoder().encode("BOOT\r\n")); sent = true; } finally { w.releaseLock(); }
        await sleep(400);
      } catch { }
      try { await port.close(); } catch { }
      return sent;
    }
    async function bootHostFromUpdateMode(port) {
      let sent = false;
      for (let a = 1; a <= 4 && !sent; a++) {
        sent = await sendBootCommand(port);
        if (!sent && port.connected === false) sent = true;
        if (!sent && a < 4) await sleep(1500 * a);
      }
      if (!sent) { const err = new Error("não consegui abrir a porta do USB Host (modo update antigo)"); err.nothingWritten = true; throw err; }
      if (!(await portWentAway(port, 4000))) return port;
      return waitHostPort(6000, true);
    }

    // TELA DA CONTROLADORA durante a gravação do host ("ATUALIZANDO USB HOST"
    // com a porcentagem real, firmware 14.9+): no máximo uma chamada por 5% e
    // 500 ms; 100 e off saem sempre; 404 uma vez cala o resto da rodada.
    let hostScreen = { ok: true, lastPct: -1, lastAt: 0, inflight: false };
    async function hostScreenSet(pct) {
      if (!hostScreen.ok || !S.ctl) return;
      const final = pct === "off" || pct === 100;
      if (!final) {
        if (pct - hostScreen.lastPct < 5 && hostScreen.lastPct >= 0) return;
        if (Date.now() - hostScreen.lastAt < 500 || hostScreen.inflight) return;
      }
      hostScreen.inflight = true; hostScreen.lastPct = final ? -1 : pct; hostScreen.lastAt = Date.now();
      try { await S.ctl.call("POST", "/update/screen", "text=host&pct=" + pct, 4000); }
      catch (e) { if (/USB 404/.test(String(e.message))) { hostScreen.ok = false; log("controladora sem a tela de atualização (firmware anterior à 14.9)"); } }
      finally { hostScreen.inflight = false; }
    }

    // Versão gravada DENTRO do app.bin (esp_app_desc_t): o PROJECT_VER do host.
    function hostAppVersionOf(bin) {
      if (!bin || bin.length < 0x50) return "";
      const u32 = (o) => (bin.charCodeAt(o) | (bin.charCodeAt(o + 1) << 8) | (bin.charCodeAt(o + 2) << 16) | (bin.charCodeAt(o + 3) << 24)) >>> 0;
      if (u32(0x20) !== 0xabcd5432) return "";
      let v = "";
      for (let i = 0x30; i < 0x50; i++) { const c = bin.charCodeAt(i); if (!c) break; v += String.fromCharCode(c); }
      return v;
    }
    // Baixa e confere os três bins ANTES de encostar no host; a versão de
    // dentro do app.bin é conferida contra o version.json (publicados fora de
    // par, a página ofereceria a mesma atualização pra sempre).
    async function prefetchHostFiles(onProgress) {
      if (S.host.pkg) return S.host.pkg;
      const m = S.hostManifest;
      const files = (m && Array.isArray(m.files) && m.files.length) ? m.files : HOST_FLASH_IMAGES;
      const total = files.reduce((a, f) => a + (f.size || 1), 0);
      let done = 0, appVersion = "";
      const fileArray = [];
      for (const f of files) {
        const sz = f.size || 1;
        const data = await fetchBin({ file: f.path, size: f.size, sha256: f.sha256, base: HOST_BASE },
          (p) => onProgress(Math.floor((done + sz * p / 100) / total * 100)));
        if (f.address + data.length > HOST_FLASH_KB * 1024) throw new Error(f.path + " não cabe na flash do USB Host");
        if (f.address === 0x10000) appVersion = hostAppVersionOf(data);
        fileArray.push({ data, address: f.address });
        done += sz; onProgress(Math.floor(done / total * 100));
      }
      if (m && m.version && appVersion && cmpVersions(appVersion, m.version) !== 0) {
        throw new Error("publicação do USB Host inconsistente (app.bin " + appVersion + ", version.json " + m.version + ")");
      }
      S.host.pkg = { fileArray, appVersion, version: (m && m.version) || appVersion };
      log(`USB Host: ${fileArray.length} arquivos prontos (${S.host.pkg.version || "?"}).`);
      return S.host.pkg;
    }
    async function readFlashSizeKb(loader) {
      try { const kb = await loader.getFlashSize(); return Number.isFinite(kb) && kb > 0 ? kb : 0; } catch { return 0; }
    }
    // O chip do outro lado É o USB HOST? O ROM do host e o da controladora S3
    // têm o mesmo VID/PID e o mesmo CHIP_NAME; quem separa é a flash (4 MB ×
    // 16 MB). Sem confirmar os 4 MB nada é gravado.
    async function assertIsHostChip(loader) {
      const chipName = String(loader.chip?.CHIP_NAME || "");
      if (!chipName.includes("ESP32-S3")) { const err = new Error("chip incorreto: esperado ESP32-S3, detectado " + (chipName || "desconhecido")); err.wrongDevice = true; throw err; }
      const kb = await readFlashSizeKb(loader);
      if (!kb) { const err = new Error("não consegui confirmar a memória de 4 MB do USB Host; nada foi gravado"); err.wrongDevice = true; throw err; }
      if (kb !== HOST_FLASH_KB) {
        const err = new Error(kb === 16384 ? "esta porta é a controladora (BFMiDi), não o USB Host" : "memória de " + (kb / 1024) + " MB — o USB Host tem 4 MB");
        err.wrongDevice = true; throw err;
      }
    }

    // ── o estágio ──
    let hostStageDone = null;   // resolve() do hostStage em curso
    function finishHostStage() { const r = hostStageDone; hostStageDone = null; if (r) r(); }
    // Sem o segundo cabo agora: a controladora já está pronta e o host fica pra
    // depois (Ferramentas › Atualizar o USB Host). O estado dele não muda.
    function skipHostStage() {
      log("Passo do USB Host pulado pelo usuário.");
      S.host.result = { outcome: "skipped" };
      finishHostStage();
    }
    // Nunca lança: o resultado vai em S.host.result (ou S.hostFailed + tela de
    // erro). `recovering` = o host já está no ROM (gravação anterior parou no
    // meio, com a BFMiDi ainda ligada): sem comando, a porta autorizada serve.
    function hostStage(opts = {}) {
      return new Promise((resolve) => {
        hostStageDone = resolve;
        hostStageRun(!!opts.recovering).catch((e) => hostFail(e));
      });
    }
    const HOST_TASKS = (want, recovering) => [
      { k: "hdl", label: `Baixar e conferir o firmware do USB Host${want ? ` (${want})` : ""}` },
      { k: "hmode", label: "Colocar o USB Host em modo de gravação", skip: recovering },
      { k: "hport", label: "Encontrar a porta do USB Host no computador" },
      { k: "hflash", label: "Gravar o USB Host" },
      { k: "hver", label: "Conferir a versão pela controladora" },
    ];
    async function hostStageRun(recovering) {
      S.host.result = null; S.host.ctlLost = false; S.host.recovering = recovering;
      hostScreen = { ok: true, lastPct: -1, lastAt: 0, inflight: false };
      setStep("host"); setMode("prepare");
      const want = (S.hostManifest && S.hostManifest.version) || "";
      // o download corre enquanto o usuário liga o cabo
      let pkgErr = null;
      const pkgP = prefetchHostFiles(() => { }).catch((e) => { pkgErr = e; return null; });

      showArt("hostPlug");
      // DIRETO (Ferramentas): sem comando pela controladora — e talvez sem a
      // controladora no cabo DEVICE. Ela ainda precisa estar LIGADA: é ela
      // que alimenta o módulo.
      const direct = !!S.host.direct;
      setCopy({
        title: direct ? "Gravar o <em>USB Host</em> pela porta HOST" : recovering ? "Vamos <em>terminar o USB Host</em>" : "Agora o <em>USB Host</em>: ligue o segundo cabo",
        desc: direct
          ? `Tire o que estiver na porta <b>HOST</b> e ligue nela um cabo USB do computador. A controladora precisa estar <b>ligada</b> — pela fonte 9 V ou pelo cabo DEVICE — porque é ela que alimenta o módulo.`
          : `Tire o que estiver na porta <b>HOST</b> e ligue nela um <b>segundo cabo USB</b> do computador. O cabo da <b>DEVICE</b> fica.`,
        extra: `<div class="tips"><span class="tip">${svgIcon.cable}Porta <b>&nbsp;HOST</b> · cabo de dados, sem hub</span><span class="tip is-warn">${svgIcon.warn}Pedais fora da HOST até o fim</span></div>
               <p class="note">USB Host ${S.host.seen ? esc(S.host.version || "antigo") + " → " : ""}<b>${esc(want)}</b>, cerca de um minuto.${direct ? " Sem comando pela controladora: serve pro módulo já em modo de gravação, em modo computador ou com o firmware pela metade." : recovering ? " O módulo continua em modo de gravação da tentativa anterior." : ""}</p>`,
        caption: "A porta HOST é USB-C em todas as placas.",
      });
      const choice = await new Promise((resolve) => setActions([
        { label: "Cabo ligado na HOST — continuar", icon: "bolt", onClick: () => resolve("go") },
        { label: "Pular o USB Host", kind: "link", icon: "swap", onClick: () => resolve("skip") },
      ]));
      setActions([]);
      if (choice === "skip") { skipHostStage(); return; }
      showTasks(HOST_TASKS(want, recovering));
      setCopy({ title: "Atualizando o <em>USB Host</em>", desc: "Pelo cabo DEVICE a controladora comanda; pelo cabo HOST o firmware entra. Mantenha os dois até o fim.", caption: "" });

      task("hdl", "active", 0);
      showArt("download");
      els.caption.textContent = `Baixando o firmware ${want} do USB Host…`;
      const pkg = await pkgP;
      if (!pkg) { const e = pkgErr || new Error("download do USB Host falhou"); e.nothingWritten = true; throw e; }
      task("hdl", "done");

      if (!recovering) {
        task("hmode", "active");
        showArt("boot");
        els.caption.textContent = "A controladora está pedindo ao módulo que entre em modo de gravação…";
        await ensureCtl();
        S.host.before = await hostConnectedPorts();   // portas que já estavam lá não são deste comando
        await hostScreenSet(0);
        if (S.host.pcMode) {
          log("USB Host em modo computador (JTAG): a porta já está no PC, sem comando.");
        } else {
          const r = await enterHostRomForCable();
          log("modo de gravação do host: " + (r.ok ? r.via : "falhou (" + r.reason + ")"));
          if (!r.ok) {
            const err = new Error(r.reason === "stillAnswering" ? "o USB Host não entrou em modo de gravação (continua respondendo)" : "o USB Host recusou o modo de gravação");
            err.hostNoMode = true; err.nothingWritten = true; throw err;
          }
        }
        S.host.inRom = true;
        task("hmode", "done");
      }

      task("hport", "active");
      showArt("hostWait");
      els.caption.textContent = "Procurando a porta do USB Host no computador…";
      const port = await waitHostPort(10000, recovering || !!S.host.pcMode);
      if (!port) { screenHostAwaitPort(); return; }   // o clique de autorizar continua o fluxo
      await hostFlashWith(port);
    }

    function screenHostAwaitPort(note) {
      setMode("await-port");
      const suffix = IS_MAC ? "(cu.usbmodem…)" : "(COM…)";
      showFrameHtml(`<div class="pdlg" aria-hidden="true">
        <div class="ti">${esc(location.host || "esta página")} quer se conectar a uma porta serial</div>
        <div class="list"><div class="row">${svgIcon.usb}<span>ESP32-S3 ${esc(suffix)}</span></div></div>
        <div class="btns"><span class="btn">Cancelar</span><span class="btn is-primary">Conectar</span></div>
        <svg class="cursor" viewBox="0 0 24 24"><path d="M5 3 L5 19 L9.5 15 L12.6 21.4 L15.2 20.2 L12.2 13.9 L18.4 13.6 Z"/></svg></div>`);
      setCopy({
        title: "Autorize a porta do <em>USB Host</em>",
        desc: "O módulo apareceu como um aparelho novo pelo cabo da HOST. Clique abaixo, escolha a linha <b>ESP32-S3</b> e confirme em <b>Conectar</b>.",
        extra: (note ? `<div class="warnbox">${esc(note)}</div>` : "") +
          `<div class="tips"><span class="tip">${svgIcon.usb}ESP32-S3 ${esc(suffix)}</span><span class="tip is-warn">${svgIcon.warn}Não é a BFMiDi do cabo DEVICE</span></div>
           <p class="note">Escolheu a linha errada? A página confere a memória do chip antes de gravar e pede de novo. Nada é gravado na porta errada.</p>`,
        caption: "A janela do navegador parece com esta.",
      });
      setActions([
        { label: "Autorizar a porta do USB Host", icon: "usb", pulse: true, onClick: hostAuthorize },
        { label: "Pular o USB Host", kind: "link", icon: "swap", onClick: skipHostStage },
      ]);
    }
    async function hostAuthorize() {
      let port = null;
      try {
        port = await serialLib().requestPort({ filters: [...HOST_ROM_PIDS, HOST_UPDATE_PID].map((pid) => ({ usbVendorId: 0x303a, usbProductId: pid })) });
      } catch (e) {
        if (e && e.name === "NotFoundError") { screenHostAwaitPort("A janela fechou sem escolher a porta. Clique de novo e escolha a linha ESP32-S3."); return; }
        hostFail(e); return;
      }
      if (port === S.device || S.badPorts.has(port) || !["rom", "update"].includes(hostPortKind(port))) {
        screenHostAwaitPort("Essa porta não é a do USB Host. Escolha a que apareceu depois de ligar o cabo na HOST.");
        return;
      }
      setMode("prepare"); setActions([]);
      showTasks(HOST_TASKS((S.hostManifest && S.hostManifest.version) || "", !!S.host.recovering));
      taskDoneUpTo("hport"); task("hport", "active");
      setCopy({ title: "Atualizando o <em>USB Host</em>", desc: "Porta autorizada. Conectando ao módulo em modo de gravação.", caption: "" });
      await hostFlashWith(port);
    }

    async function hostFlashWith(port) {
      try {
        if (hostPortKind(port) === "update") {
          log("host antigo no modo update (4002): mandando BOOT");
          task("hmode", "active");
          const rom = await bootHostFromUpdateMode(port);
          if (!rom) { screenHostAwaitPort("O bootloader apareceu como uma porta nova: autorize de novo."); return; }
          port = rom;
          if (port === S.device || hostPortKind(port) !== "rom") { screenHostAwaitPort("Essa porta não é a do USB Host."); return; }
          task("hmode", "done");
        }
        const info = portInfo(port);
        log(`porta do host: VID=0x${(info.usbVendorId || 0).toString(16)} PID=0x${(info.usbProductId || 0).toString(16)}`);
        task("hport", "done");
        setMode("flash");
        task("hflash", "active", 0);
        showRing("host", "USB HOST", "conectando ao módulo…");
        els.caption.textContent = S.ctl ? "A tela da controladora mostra ATUALIZANDO USB HOST." : "Gravando pelo cabo da porta HOST…";
        // Na porta USB-JTAG (1001) é sempre o reset do próprio S3 (default_reset):
        // ele LEVA o chip ao bootloader mesmo sem o firmware ajudar. A porta OTG
        // do ROM (0009) já é o bootloader e não tem reset por sinal: no_reset.
        const mode = info.usbProductId === 0x1001 ? "default_reset" : "no_reset";
        let transport = null, loader = null, lastErr = null;
        for (let a = 1; a <= 4 && !loader; a++) {
          try {
            transport = fixReadLoop(wrapSignals(new Transport(port, true)));
            const l = new ESPLoader({ transport, baudrate: 115200, romBaudrate: 115200, terminal: espLoaderTerminal });
            await l.main(mode);
            loader = l;
          } catch (e) {
            lastErr = e;
            await closeTransportSafe(transport); transport = null;
            log(`host: tentativa ${a} falhou: ${e.message}`);
            const openFail = /open|in use|busy|access/i.test(String(e && e.message));
            if (a < 4) await sleep((openFail ? 1500 : 700) * a);
          }
        }
        if (!loader) {
          const err = new Error("não consegui falar com o USB Host: " + (lastErr && lastErr.message));
          err.hostNoSync = true; err.nothingWritten = true; throw err;
        }
        let stage = "chip";
        try {
          await assertIsHostChip(loader);
          const pkg = S.host.pkg;
          const names = ["bootloader", "tabela de partições", "aplicativo"];
          stage = "flash";
          await loader.writeFlash({
            fileArray: pkg.fileArray, eraseAll: false, compress: true, flashSize: "4MB", flashMode: "keep", flashFreq: "keep",
            calculateMD5Hash: (typeof CryptoJS !== "undefined") ? (image) => CryptoJS.MD5(CryptoJS.enc.Latin1.parse(image)) : undefined,
            reportProgress: (idx, written, total) => {
              const v = idx / pkg.fileArray.length + (total ? (written / total) / pkg.fileArray.length : 0);
              const pct = Math.round(v * 100);
              task("hflash", "active", pct);
              setRing(pct, "host", "USB HOST", names[idx] || "");
              void hostScreenSet(Math.min(99, pct));
            },
          });
          stage = "reset";
          setRing(100, "wait", "REINICIANDO", "o módulo volta sozinho");
          try { await resetS3ByWatchdog(loader); }
          catch (e) { log("watchdog do host falhou (" + e.message + ") — reset padrão."); try { await loader.after("hard_reset", info.usbProductId === 0x0009); } catch { } }
        } catch (e) {
          if (e && typeof e === "object") { if (stage === "flash") e.partial = true; else if (!e.partial) e.nothingWritten = true; }
          throw e;
        } finally { await closeTransportSafe(transport); }
        // Rodando o firmware, a USB do host vira porta HOST e some do PC.
        const rebooted = await portWentAway(port, 6000);
        log("USB Host gravado" + (rebooted ? "." : " — a porta continua de pé (ficou no bootloader?)."));
        S.host.inRom = false;
        task("hflash", "done");
        await hostScreenSet(100);

        task("hver", "active");
        setRing(100, "wait", "CONFERINDO", "pela controladora");
        const want = S.host.pkg.version || S.host.pkg.appVersion || "";

        // controladora já está aberto — sem esperar uma que pode nem estar no cabo.

          catch (e) { log("sem canal com a controladora pra conferir: " + e.message); }
        }
