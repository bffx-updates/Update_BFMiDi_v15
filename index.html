<!doctype html>
<html lang="pt-BR" data-step="1" data-mode="idle">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atualizador BFMiDi V15</title>
  <meta name="description" content="Atualize o firmware da sua controladora BFMiDi pelo cabo USB, passo a passo, direto do navegador." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23F0552F'/%3E%3Cpath d='M32 12v26M22 22l10-10 10 10' fill='none' stroke='%231a0c06' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='32' cy='48' r='6' fill='%231a0c06'/%3E%3C/svg%3E" />
  <style>
    /* ══════════════════════════════════════════════════════════════════
       ATUALIZADOR BFMiDi — passo a passo (out/2026)
       Um trilho de passos no alto e dois cards embaixo: a ilustração (ou a
       placa de status) à esquerda e o texto + ações à direita. A ilustração
       muda a cada passo (updater_art.js).
       PELE = DESIGN SYSTEM BFX (DESIGN_SYSTEM/DESIGN_SYSTEM.md, 31/out/2026):
       a mesma cara do editor — vidro sobre carvão, laranja só no que está
       aceso ou é a ação, títulos e rótulos em caixa alta, valores em mono.
       Só o tema escuro, o padrão do editor. Os tokens --bfx-* abaixo são
       CÓPIA do §11; mudou lá, atualize aqui. As classes e o JS da página
       são os mesmos de antes: só a aparência mudou.
       ══════════════════════════════════════════════════════════════════ */

    /* ═══ BFX · TOKENS · tema escuro (cópia do §11) ═══ */
    :root {
      color-scheme: dark;

      --bfx-accent:      #FC6337;
      --bfx-accent-2:    #FF8A4C;
      --bfx-accent-ink:  #FF8A66;
      --bfx-accent-grad: linear-gradient(158deg, rgba(255,150,92,.94) 0%, rgba(224,68,44,.86) 100%);
      --bfx-accent-lift: inset 0 1px 0 rgba(255,255,255,.50), 0 12px 28px -10px rgba(252,99,55,.65);
      --bfx-accent-chip: inset 0 1px 0 rgba(255,255,255,.40), 0 10px 24px -10px rgba(252,99,55,.55);
      --bfx-action:      linear-gradient(158deg, #C94A1A 0%, #A33A10 100%);
      --bfx-action-lift: inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px -8px rgba(201,74,26,.65);
      --bfx-hero:        linear-gradient(120deg, #FF8A4C 0%, #F0552F 50%, #DE3F27 100%);
      --bfx-on-accent:   #FFFFFF;

      --bfx-bg-solid: #171A20;
      --bfx-bg:       linear-gradient(180deg, #1E232B 0%, #171A20 100%);
      --bfx-ambient:  radial-gradient(120% 80% at 14% -10%, rgba(120,130,148,.26) 0%, rgba(120,130,148,.10) 38%, transparent 70%);

      --bfx-glass:        linear-gradient(158deg, rgba(255,255,255,.11) 0%, rgba(255,255,255,.045) 100%);
      --bfx-card:         linear-gradient(158deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.055) 100%), rgba(20,22,26,.28);
      --bfx-modal:        linear-gradient(162deg, rgba(62,66,74,.92) 0%, rgba(46,49,56,.94) 55%, rgba(40,43,49,.95) 100%);
      --bfx-raised:       linear-gradient(158deg, rgba(255,255,255,.095) 0%, rgba(255,255,255,.03) 100%);
      --bfx-raised-hover: linear-gradient(158deg, rgba(255,255,255,.135) 0%, rgba(255,255,255,.05) 100%);
      --bfx-raised-press: linear-gradient(158deg, rgba(255,255,255,.06) 0%, rgba(255,255,255,.02) 100%);
      --bfx-disc:         linear-gradient(158deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.07) 100%);
      --bfx-seg-on:       linear-gradient(158deg, rgba(255,255,255,.20) 0%, rgba(255,255,255,.095) 100%);
      --bfx-well:         linear-gradient(180deg, rgba(4,6,8,.44) 0%, rgba(4,6,8,.26) 100%);
      --bfx-well-deep:    linear-gradient(180deg, rgba(4,6,8,.52) 0%, rgba(4,6,8,.32) 100%);
      --bfx-sub:          linear-gradient(180deg, rgba(4,6,8,.30) 0%, rgba(4,6,8,.16) 100%);
      --bfx-display:        linear-gradient(160deg, #14181D 0%, #0D1014 55%, #0A0D10 100%);
      --bfx-display-edge:   rgba(255,255,255,.10);
      --bfx-display-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.45), inset 0 14px 26px -14px rgba(0,0,0,.60), inset 0 0 42px rgba(0,0,0,.55);

      --bfx-field:        var(--bfx-well-deep);
      --bfx-field-shadow: inset 0 0 0 1px rgba(255,255,255,.085), inset 0 1px 0 rgba(255,255,255,.06), inset 0 10px 18px -13px rgba(0,0,0,.55);

      --bfx-text:   #E9EBED;
      --bfx-text-2: color-mix(in srgb, var(--bfx-text) 78%, transparent);
      --bfx-lead:   color-mix(in srgb, var(--bfx-text) 74%, transparent);
      --bfx-text-3: #8C9298;

      --bfx-hair:       rgba(255,255,255,.12);
      --bfx-hair-in:    rgba(255,255,255,.085);
      --bfx-hair-hover: rgba(255,255,255,.20);
      --bfx-edge:       rgba(255,255,255,.14);
      --bfx-divider:    rgba(255,255,255,.09);

      --bfx-toplight:     inset 0 1px 0 rgba(255,255,255,.18);
      --bfx-shadow-bar:   inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(255,255,255,.06), 0 26px 52px -20px rgba(0,0,0,.80);
      --bfx-shadow-card:  inset 0 1px 0 rgba(255,255,255,.26), inset 0 -1px 0 rgba(255,255,255,.05), 0 20px 44px -22px rgba(0,0,0,.60);
      --bfx-shadow-block: inset 0 1px 0 rgba(255,255,255,.16), 0 6px 14px -10px rgba(0,0,0,.50);
      --bfx-shadow-well:  inset 0 1px 0 rgba(255,255,255,.06), inset 0 10px 18px -13px rgba(0,0,0,.55);
      --bfx-shadow-sub:   inset 0 1px 0 rgba(255,255,255,.05), inset 0 10px 20px -16px rgba(0,0,0,.45);
      --bfx-shadow-seg:   inset 0 1px 0 rgba(255,255,255,.26), inset 0 0 0 1px rgba(255,255,255,.08), 0 6px 14px -8px rgba(0,0,0,.70);
      --bfx-shadow-modal: inset 0 1px 0 rgba(255,255,255,.10), 0 0 0 1px rgba(0,0,0,.35), 0 30px 80px -24px rgba(0,0,0,.70);
      --bfx-blur:         blur(24px) saturate(155%);
      --bfx-modal-filter: blur(24px) saturate(140%);
      --bfx-veil:         rgba(6,7,9,.72);
      --bfx-veil-filter:  blur(10px) saturate(85%);
      --bfx-press:        brightness(.92);

      --bfx-toggle-on:        linear-gradient(180deg, var(--bfx-accent-2) 0%, var(--bfx-accent) 100%);
      --bfx-toggle-on-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 10px -3px color-mix(in srgb, var(--bfx-accent) 40%, transparent);
      --bfx-toggle-off:       var(--bfx-well);
      --bfx-toggle-edge:      rgba(255,255,255,.42);
      --bfx-knob:             linear-gradient(180deg, #FFFFFF 0%, #EEF1F4 100%);
      --bfx-knob-shadow:      0 2px 5px rgba(0,0,0,.40);

      --bfx-ok:   #3ADC62;
      --bfx-warn: #F5B544;
      --bfx-err:  #FF7A72;
      --bfx-info: #8CC0FF;
      --bfx-off:  color-mix(in srgb, var(--bfx-text) 60%, transparent);
      --bfx-select:      #3BA0F2;
      --bfx-select-glow: rgba(59,160,242,.42);
      --bfx-danger:      linear-gradient(180deg, #8F2723 0%, #571716 100%);
      --bfx-danger-ring: rgba(255,92,80,.62);

      --bfx-ring: var(--bfx-accent);

      --bfx-r-modal: 30px;  --bfx-r-card: 28px;  --bfx-r-bar: 24px;  --bfx-r-rail: 22px;
      --bfx-r-sub: 20px;    --bfx-r-block: 18px; --bfx-r-field: 18px; --bfx-r-seg: 17px;
      --bfx-r-btn: 16px;    --bfx-r-chip: 14px;  --bfx-r-sm: 12px;    --bfx-r-pill: 999px;

      --bfx-font:         -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --bfx-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --bfx-font-mono:    ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;

      --bfx-sb-thumb:       rgba(255,255,255,.16);
      --bfx-sb-thumb-hover: rgba(255,255,255,.30);
    }
    /* nomes da página que o resto do CSS e as ilustrações ainda usam */
    :root {
      --w: 1280px;
      --accent: var(--bfx-accent);
      --accent-2: var(--bfx-accent-2);
      --text: var(--bfx-text);
      --muted: var(--bfx-text-2);
      --faint: var(--bfx-text-3);
      --green: var(--bfx-ok);
      --amber: var(--bfx-warn);
      --red: var(--bfx-err);
      --blue: var(--bfx-select);
      --teal: var(--bfx-info);
      --line: var(--bfx-hair-in);
      --line-2: var(--bfx-hair);
    }

    /* ─── tela: carvão com a luz ambiente numa camada FIXA (o vidro precisa dela) ─── */
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100%; min-height: 100dvh;
      font-family: var(--bfx-font); color: var(--bfx-text);
      -webkit-font-smoothing: antialiased;
      background: var(--bfx-bg-solid);
      display: flex; flex-direction: column; align-items: center;
      padding: 22px 24px 40px;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: var(--bfx-ambient), var(--bfx-bg);
    }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    /* o atributo hidden vale mesmo em peça com display próprio (.btn é inline-flex:
       sem isto o "Baixar backup guardado" aparecia sempre no registro técnico) */
    [hidden] { display: none !important; }
    /* foco: um só para todos os controles (§10) */
    :is(button, a, summary):focus-visible { outline: 2px solid var(--bfx-ring); outline-offset: 3px; }

    /* ─── topo: marca à esquerda; estado, versão publicada, Ferramentas e Manual à direita ─── */
    .top {
      position: relative; z-index: 1; width: 100%; max-width: var(--w);
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .brand .logo {
      width: 52px; height: 52px; border-radius: var(--bfx-r-btn); flex: 0 0 auto;
      background: var(--bfx-accent-grad); box-shadow: var(--bfx-accent-chip);
      display: grid; place-items: center;
    }
    .brand .logo svg { width: 28px; height: 28px; }
    .brand .wm { display: block; font: 800 28px/1 var(--bfx-font-display); letter-spacing: -.02em; color: var(--bfx-text); }
    .brand .wm i { font-style: normal; color: inherit; }
    .brand .sub { display: flex; align-items: baseline; gap: 10px; margin-top: 7px; font: 600 11px/1 var(--bfx-font-mono); letter-spacing: .2em; color: var(--bfx-text-2); }
    .brand .sub i { font-style: normal; letter-spacing: .08em; color: var(--bfx-text-3); }
    .top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .top-right .sep { width: 1px; height: 24px; background: var(--bfx-divider); }
    /* pílulas: o que só INFORMA (estado, versão publicada) fica afundado; o que
       se toca (Ferramentas, Manual) fica levantado */
    .pill {
      display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 16px; border: 0; border-radius: var(--bfx-r-pill);
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
      font: 600 12px/1 var(--bfx-font); letter-spacing: .1em; text-transform: uppercase; color: var(--bfx-text-2);
      text-decoration: none; white-space: nowrap;
    }
    .pill svg { width: 18px; height: 18px; color: var(--bfx-text-3); flex: 0 0 auto; }
    .pill b { font: 700 13px/1 var(--bfx-font-mono); letter-spacing: .02em; text-transform: none; color: var(--bfx-text); }
    .pill .d { width: 8px; height: 8px; border-radius: 50%; background: var(--bfx-text-3); flex: 0 0 auto; }
    .pill.is-ok .d { background: var(--bfx-ok); box-shadow: 0 0 8px color-mix(in srgb, var(--bfx-ok) 70%, transparent); }
    .pill.is-busy .d { background: var(--bfx-accent); box-shadow: 0 0 8px color-mix(in srgb, var(--bfx-accent) 70%, transparent); }
    .pill.is-err .d { background: var(--bfx-err); box-shadow: 0 0 8px color-mix(in srgb, var(--bfx-err) 70%, transparent); }
    .pill.is-ok, .pill.is-busy, .pill.is-err { color: var(--bfx-text); }
    a.pill, .pill.is-btn {
      cursor: pointer; font-family: var(--bfx-font); appearance: none; -webkit-appearance: none;
      background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-block); color: var(--bfx-text);
      transition: background .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    a.pill svg, .pill.is-btn svg { color: var(--bfx-text-2); }
    @media (hover: hover) {
      a.pill:hover, .pill.is-btn:not(.is-on):hover { background: var(--bfx-raised-hover); box-shadow: inset 0 0 0 1px var(--bfx-hair-hover), var(--bfx-shadow-block); }
      a.pill:hover svg, .pill.is-btn:not(.is-on):hover svg { color: var(--bfx-text); }
    }
    a.pill:active, .pill.is-btn:active { filter: var(--bfx-press); }
    /* Ferramentas aberta = a tela atual: acesa, como a aba atual do editor */
    .pill.is-btn.is-on { background: var(--bfx-accent-grad); box-shadow: var(--bfx-accent-lift); color: var(--bfx-on-accent); }
    .pill.is-btn.is-on svg { color: var(--bfx-on-accent); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

    /* ─── assistente: o trilho de passos (barra de vidro) e os dois cards ─── */
    .wiz { position: relative; z-index: 1; width: 100%; max-width: var(--w); }

    /* trilho: passo feito = levantado com o número em verde (concluído), atual =
       aceso em laranja, os próximos afundados */
    .rail {
      display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 0; position: relative;
      padding: 14px 10px 12px;
      border: 1px solid var(--bfx-edge); border-radius: var(--bfx-r-bar);
      background: var(--bfx-glass); box-shadow: var(--bfx-shadow-bar);
      -webkit-backdrop-filter: var(--bfx-blur); backdrop-filter: var(--bfx-blur);
    }
    .rail .st { display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; text-align: center; }
    .rail .st::before, .rail .st::after {
      content: ""; position: absolute; top: 21px; height: 2px; width: calc(50% - 30px); border-radius: 2px;
      background: var(--bfx-divider); transition: background .2s ease;
    }
    .rail .st::before { left: 0; } .rail .st::after { right: 0; }
    .rail .st:first-child::before, .rail .st:last-child::after { display: none; }
    .rail .st .n {
      width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 0;
      font: 700 17px/1 var(--bfx-font-display); color: var(--bfx-text-3);
      background: var(--bfx-well-deep); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
      transition: background .2s ease, box-shadow .2s ease, color .2s ease;
    }
    .rail .st .n svg { display: none; }
    .rail .st .t { font: 700 11.5px/1.2 var(--bfx-font-mono); letter-spacing: .14em; color: var(--bfx-text-3); transition: color .2s ease; }
    .rail .st.is-done .n {
      color: var(--bfx-ok); background: var(--bfx-raised);
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bfx-ok) 50%, transparent), var(--bfx-shadow-block);
    }
    .rail .st.is-done .t { color: var(--bfx-text-2); }
    .rail .st.is-done::before, .rail .st.is-done::after, .rail .st.is-active::before { background: color-mix(in srgb, var(--bfx-ok) 55%, transparent); }
    .rail .st.is-active .n {
      color: var(--bfx-on-accent); background: var(--bfx-accent-grad);
      box-shadow: var(--bfx-accent-lift), 0 0 0 4px color-mix(in srgb, var(--bfx-accent) 16%, transparent);
    }
    .rail .st.is-active .t { color: var(--bfx-text); }
    [data-mode="error"] .rail .st.is-active .n { background: var(--bfx-danger); box-shadow: inset 0 0 0 1px var(--bfx-danger-ring), 0 0 0 4px color-mix(in srgb, var(--bfx-err) 16%, transparent); }
    /* PRONTO: o passo atual também é concluído, então fica verde como os feitos */
    [data-mode="done"] .rail .st.is-active .n {
      color: var(--bfx-ok);
      background: linear-gradient(158deg, color-mix(in srgb, var(--bfx-ok) 24%, transparent), color-mix(in srgb, var(--bfx-ok) 8%, transparent)), var(--bfx-raised);
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bfx-ok) 60%, transparent), 0 0 0 4px color-mix(in srgb, var(--bfx-ok) 14%, transparent), var(--bfx-shadow-block);
    }

    .body { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); gap: 16px; margin-top: 16px; }

    /* os dois cards: lâminas de vidro (§6 Card) */
    .visual, .copy {
      position: relative; border: 1px solid var(--bfx-hair); border-radius: var(--bfx-r-card);
      background: var(--bfx-card); box-shadow: var(--bfx-shadow-card);
      -webkit-backdrop-filter: var(--bfx-blur); backdrop-filter: var(--bfx-blur);
    }
    /* card da esquerda: a ilustração do passo ou a placa de status */
    .visual { padding: 18px; min-height: 440px; display: flex; flex-direction: column; gap: 12px; }
    .frame {
      position: relative; flex: 1; border-radius: var(--bfx-r-sub); overflow: hidden; min-height: 330px;
      display: grid; place-items: center;
    }
    /* a ilustração dos passos fica num MOSTRADOR (o poço bem escuro do §6);
       a placa de status toma o card inteiro */
    .frame:has(> .ar), .frame:has(> .pdlg), .frame:has(> .ring) {
      background: var(--bfx-display); box-shadow: var(--bfx-display-shadow); border: 1px solid var(--bfx-display-edge);
    }
    /* a placa não precisa do recorte: no celular o canto arredondado comia o B de BFMiDi */
    .frame:has(> .plate) { overflow: visible; }
    .frame > * { grid-area: 1 / 1; }
    .frame .ar { width: 100%; height: auto; max-height: 100%; display: block; }
    .caption { font: 400 14px/1.5 var(--bfx-font); color: var(--bfx-lead); text-align: center; min-height: 18px; }
    .caption:empty { display: none; }
    .caption b { color: var(--bfx-text); font-weight: 600; }
    .caption .k { display: inline-flex; align-items: center; gap: 6px; margin: 0 6px; }
    .caption .k i { width: 9px; height: 9px; border-radius: 3px; background: var(--bfx-accent); display: inline-block; }
    .caption .k i.c { background: var(--bfx-select); }
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* placa de status (passos 2 e 5): o modelo em letra de mostrador, o desenho
       da controladora, as fichas de chip/série/ID e um poço por peça */
    .plate { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 14px; }
    .plate-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding: 2px 2px 0; }
    .plate-fam { font: 700 12px/1 var(--bfx-font-mono); letter-spacing: .2em; color: var(--bfx-text-2); }
    .plate-var { font: 800 clamp(44px, 5vw, 72px)/.9 var(--bfx-font-display); letter-spacing: -.036em; margin-top: 10px; overflow-wrap: anywhere; color: var(--bfx-text); }
    /* nome comprido ("controladora", "em modo de gravação"): letra menor, pra não
       partir a palavra no meio (§3.3) */
    .plate-var.is-long { font-size: clamp(28px, 2.8vw, 40px); line-height: 1.02; letter-spacing: -.02em; }
    .plate-dev { width: clamp(150px, 17vw, 236px); height: auto; justify-self: end; filter: drop-shadow(0 18px 22px rgba(0,0,0,.55)); }
    .plate-dev .pd-fam { fill: #fff; font: 700 12.5px var(--bfx-font-display); letter-spacing: .02em; }
    .plate-dev .pd-fam tspan { fill: var(--bfx-accent); }
    .plate-dev .pd-var { fill: #d3dae6; font: 800 27px var(--bfx-font-display); letter-spacing: -.02em; }
    .plate-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
    .plate-meta span {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--bfx-r-chip); white-space: nowrap;
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
      font: 600 12.5px/1 var(--bfx-font-mono); letter-spacing: .03em; color: var(--bfx-text-2);
    }
    .plate-meta span svg { width: 15px; height: 15px; color: var(--bfx-text-3); }
    .plate-rows { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .prow {
      flex: 1; min-height: 150px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "ic t b" "v v a";
      align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--bfx-r-sub);
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
    }
    .prow-ic {
      grid-area: ic; width: 46px; height: 46px; border-radius: var(--bfx-r-chip); display: grid; place-items: center; color: var(--bfx-text);
      background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair), var(--bfx-shadow-block);
    }
    .prow-ic svg { width: 23px; height: 23px; }
    .prow-t { grid-area: t; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .prow-t b { font: 700 15px/1.2 var(--bfx-font); letter-spacing: .04em; text-transform: uppercase; }
    .prow-t span { font: 400 13.5px/1.35 var(--bfx-font); color: var(--bfx-lead); }
    .prow .badge { grid-area: b; justify-self: end; }
    .prow-v {
      grid-area: v; display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 18px; border-radius: var(--bfx-r-field);
      background: var(--bfx-field); box-shadow: var(--bfx-field-shadow);
      font: 700 32px/1 var(--bfx-font-display); letter-spacing: -.02em; color: var(--bfx-text);
    }
    .prow-v b { font-weight: 700; } .prow-v b.is-new { color: var(--bfx-accent-ink); } .prow-v b.is-ok { color: var(--bfx-ok); } .prow-v b.is-warn { color: var(--bfx-warn); }
    .prow-v b.is-small { font: 600 17px/1.2 var(--bfx-font); letter-spacing: 0; color: var(--bfx-text-2); }
    .prow-arrow { display: flex; color: var(--bfx-text-3); } .prow-arrow svg { width: 22px; height: 22px; }
    /* botão de atualização INDEPENDENTE por linha (pedido do dono, 24/out):
       quem só quer a controladora, ou só o USB Host, aciona daqui. Com versão
       nova é o laranja de ação (texto branco ~5:1); reinstalar é levantado. */
    .prow-act {
      grid-area: a; justify-self: end; min-height: 56px; padding: 0 20px 0 18px; border: 0; border-radius: var(--bfx-r-btn); cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 9px;
      background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-block); color: var(--bfx-text);
      font: 700 13px/1 var(--bfx-font); letter-spacing: .1em; text-transform: uppercase;
      transition: background .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
    }
    .prow-act svg { width: 20px; height: 20px; }
    .prow-act.is-new { background: var(--bfx-action); box-shadow: var(--bfx-action-lift); color: var(--bfx-on-accent); }
    @media (hover: hover) {
      .prow-act:not(.is-new):hover:not(:disabled) { background: var(--bfx-raised-hover); box-shadow: inset 0 0 0 1px var(--bfx-hair-hover), var(--bfx-shadow-block); }
      .prow-act.is-new:hover:not(:disabled) { filter: brightness(1.07); }
    }
    .prow-act:active:not(:disabled) { filter: var(--bfx-press); }
    .prow-act:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 480px) { .prow { grid-template-areas: "ic t t" "b b b" "v v v" "a a a"; } .prow .badge { justify-self: start; } .prow-act { justify-self: stretch; justify-content: center; } }

    /* anel de progresso (passo 4): FIRMWARE laranja (a ação), EDITOR azul,
       devolução dos dados verde, USB Host azul-claro */
    .ring { width: min(100%, 300px); aspect-ratio: 1; display: grid; place-items: center; position: relative; }
    .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring .track { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 10; }
    /* o brilho vai no <svg> inteiro: no círculo ele era cortado na caixa do
       próprio círculo e aparecia um quadrado em volta do anel */
    .ring { --rc: var(--bfx-accent); }
    .ring.is-app { --rc: var(--bfx-select); }
    .ring.is-data { --rc: var(--bfx-ok); }
    .ring.is-host { --rc: var(--bfx-info); }
    .ring svg { filter: drop-shadow(0 0 7px color-mix(in srgb, var(--rc) 50%, transparent)); }
    .ring .bar { fill: none; stroke: var(--rc); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 339.3; stroke-dashoffset: 339.3; transition: stroke-dashoffset .35s ease, stroke .2s ease; }
    .ring.is-wait .bar { stroke-dasharray: 40 299.3; }
    @keyframes ring-spin { to { stroke-dashoffset: -339.3; } }
    .ring .inner { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .ring .pct { font: 700 60px/1 var(--bfx-font-display); letter-spacing: -.036em; color: var(--bfx-text); }
    .ring .pct sup { font: 600 18px/1 var(--bfx-font-mono); color: var(--bfx-text-2); margin-left: 3px; }
    .ring .lab { font: 700 11px/1 var(--bfx-font-mono); letter-spacing: .2em; color: var(--bfx-text-2); }
    .ring .sublab { font: 400 12.5px/1.3 var(--bfx-font); color: var(--bfx-text-3); min-height: 16px; }

    /* janela de porta do navegador (passo 3, autorização): imita a do Chrome,
       por isso fica com as cores e a letra dela, não as do BFX */
    .pdlg {
      position: relative; width: min(100%, 330px); padding: 14px 15px 13px; border-radius: 12px;
      background: #2b2c30; color: #e8eaed; text-align: left;
      box-shadow: 0 16px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08);
      font: 500 12.5px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
    }
    .pdlg .ti { font-weight: 600; margin-bottom: 10px; }
    .pdlg .list { border-radius: 8px; padding: 4px; background: rgba(127,127,127,.14); }
    .pdlg .row { display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 6px; font-weight: 600; background: color-mix(in srgb, var(--bfx-accent) 22%, transparent); box-shadow: inset 0 0 0 2px var(--bfx-accent); overflow-wrap: anywhere; }
    .pdlg .row svg { width: 15px; height: 15px; flex: 0 0 auto; }
    .pdlg .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .pdlg .btn {
      min-height: 0; padding: 6px 14px; border-radius: 16px; background: none; color: #e8eaed;
      box-shadow: inset 0 0 0 1px rgba(127,127,127,.45);
      font: 600 12px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: normal; text-transform: none; pointer-events: none;
    }
    .pdlg .btn.is-primary { background: #1a73e8; color: #fff; box-shadow: 0 0 0 2px var(--bfx-accent); }
    .pdlg .cursor { position: absolute; left: 46%; top: 44%; width: 22px; height: 22px; fill: #fff; stroke: #111; stroke-width: 1.3; stroke-linejoin: round; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.4)); pointer-events: none; }

    /* card da direita: ícone do passo + título, texto e ações */
    .copy { padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 440px; }
    .copy-head { display: flex; align-items: center; gap: 20px; }
    /* o ícone é decorativo: disco neutro (laranja é só para o que está aceso);
       ganha cor só quando diz estado — concluído (verde) e erro (vermelho) */
    .copy-ic {
      width: 84px; height: 84px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; color: var(--bfx-text);
      background: var(--bfx-disc); box-shadow: inset 0 0 0 1px var(--bfx-hair), var(--bfx-shadow-block);
      transition: color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .copy-ic svg { width: 36px; height: 36px; }
    .copy-ic:empty { display: none; }
    [data-mode="done"] .copy-ic {
      color: var(--bfx-ok);
      background: linear-gradient(158deg, color-mix(in srgb, var(--bfx-ok) 24%, transparent), color-mix(in srgb, var(--bfx-ok) 8%, transparent)), var(--bfx-raised);
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bfx-ok) 55%, transparent), 0 0 22px -6px color-mix(in srgb, var(--bfx-ok) 45%, transparent), var(--bfx-shadow-block);
    }
    [data-mode="error"] .copy-ic {
      color: var(--bfx-err);
      background: linear-gradient(158deg, color-mix(in srgb, var(--bfx-err) 24%, transparent), color-mix(in srgb, var(--bfx-err) 8%, transparent)), var(--bfx-raised);
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--bfx-err) 55%, transparent), 0 0 22px -6px color-mix(in srgb, var(--bfx-err) 45%, transparent), var(--bfx-shadow-block);
    }
    .copy-ht { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    /* rótulo de passo e de janela: mono miúdo, com o ponto laranja do título de card */
    .eyebrow { display: flex; align-items: center; gap: 9px; font: 600 12px/1 var(--bfx-font-mono); letter-spacing: .18em; text-transform: uppercase; color: var(--bfx-text-2); }
    .eyebrow::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--bfx-accent); }
    h1.title { margin: 0; font: 500 clamp(28px, 2.9vw, 40px)/1.12 var(--bfx-font-display); letter-spacing: -.022em; overflow-wrap: anywhere; color: var(--bfx-text); }
    h1.title em { font-style: normal; font-weight: 800; }
    .desc { margin: 0; font: 400 16.5px/1.55 var(--bfx-font); color: var(--bfx-lead); }
    .desc b { color: var(--bfx-text); font-weight: 600; }
    .tips { display: flex; flex-wrap: wrap; gap: 8px; }
    /* bloco de texto corrido (não flex): o negrito no meio da frase não abre vão */
    .tip {
      display: inline-block; padding: 9px 13px; border-radius: var(--bfx-r-chip);
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
      font: 500 14px/1.3 var(--bfx-font); color: var(--bfx-text-2);
    }
    .tip b { color: var(--bfx-text); font-weight: 700; }
    .tip svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px; color: var(--bfx-text-3); }
    .tip.is-warn {
      color: var(--bfx-text);
      background: color-mix(in srgb, var(--bfx-warn) 11%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bfx-warn) 38%, transparent);
    }
    .tip.is-warn svg { color: var(--bfx-warn); }

    /* versões: INSTALADA → NOVA */
    .vt { display: flex; align-items: stretch; gap: 10px; }
    .vt-h { font: 600 10.5px/1 var(--bfx-font-mono); letter-spacing: .18em; color: var(--bfx-text-3); margin: 2px 0 -8px; display: flex; align-items: center; gap: 8px; }
    .vt-h .badge { margin-left: auto; }
    .vt-wrap { display: flex; flex-direction: column; gap: 14px; }
    .vt-tile {
      flex: 1; border-radius: var(--bfx-r-chip); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
    }
    .vt-tile .k { font: 600 10.5px/1 var(--bfx-font-mono); letter-spacing: .16em; color: var(--bfx-text-3); }
    .vt-tile b { font: 700 26px/1 var(--bfx-font-display); letter-spacing: -.02em; }
    .vt-tile.is-new { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bfx-accent) 45%, transparent), var(--bfx-shadow-well); }
    .vt-tile.is-new b { color: var(--bfx-accent-ink); }
    .vt-tile.is-same { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bfx-ok) 42%, transparent), var(--bfx-shadow-well); }
    .vt-tile.is-same b { color: var(--bfx-ok); }
    .vt-arrow { align-self: center; color: var(--bfx-text-3); display: flex; }
    .vt-arrow svg { width: 22px; height: 22px; }
    /* selo de estado (§6 Selo): ATUALIZAÇÃO laranja (como no card do editor),
       EM DIA verde, o resto âmbar; o ícone já diz o estado, sem a bolinha */
    .badge {
      --k: var(--bfx-warn);
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; height: 26px; padding: 0 11px; border: 0; border-radius: var(--bfx-r-pill); white-space: nowrap;
      font: 800 10.5px/1 var(--bfx-font); letter-spacing: .08em; text-transform: uppercase;
      color: var(--k); background: color-mix(in srgb, var(--k) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 34%, transparent);
    }
    .badge svg { width: 13px; height: 13px; flex: 0 0 auto; }
    .badge.is-new { color: var(--bfx-accent-ink); background: color-mix(in srgb, var(--bfx-accent) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bfx-accent) 45%, transparent); }
    .badge.is-same { --k: var(--bfx-ok); }
    .badge.is-unk { --k: var(--bfx-warn); }
    .badge .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* "Versão disponível no servidor: X" — abre as novidades */
    details.notes { border-radius: var(--bfx-r-chip); background: var(--bfx-sub); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-sub); }
    details.notes summary { cursor: pointer; list-style: none; padding: 14px 16px; border-radius: var(--bfx-r-chip); font: 500 15px/1.3 var(--bfx-font); color: var(--bfx-text-2); display: flex; align-items: center; gap: 12px; }
    details.notes summary::-webkit-details-marker { display: none; }
    details.notes summary b { color: var(--bfx-text); font: 700 14px/1 var(--bfx-font-mono); letter-spacing: .02em; }
    details.notes summary svg { width: 19px; height: 19px; color: var(--bfx-text-3); flex: 0 0 auto; }
    details.notes summary svg.chev { margin-left: auto; width: 18px; height: 18px; transition: transform .15s ease; }
    details.notes[open] summary svg.chev { transform: rotate(90deg); }
    @media (hover: hover) { details.notes summary:hover { color: var(--bfx-text); } }
    details.notes pre { margin: 0; padding: 0 16px 16px; white-space: pre-wrap; font: 400 14px/1.55 var(--bfx-font); color: var(--bfx-lead); max-height: 200px; overflow: auto; }

    /* opções (popup Configurações): linha com chave, rótulo à esquerda e a
       chave à direita (§6 Linha com chave) */
    .opt {
      display: flex; flex-direction: row-reverse; align-items: center; justify-content: space-between; gap: 14px;
      min-height: 64px; padding: 13px 15px; border-radius: var(--bfx-r-sub); cursor: pointer;
      background: var(--bfx-sub); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-sub);
    }
    .opt .sw { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
    .opt input { position: absolute; opacity: 0; width: 0; height: 0; }
    .opt .tr {
      position: absolute; inset: 0; border-radius: var(--bfx-r-pill);
      background: var(--bfx-toggle-off); box-shadow: inset 0 0 0 1px var(--bfx-toggle-edge), var(--bfx-shadow-well);
      transition: background .15s ease, box-shadow .15s ease;
    }
    .opt .tr::before {
      content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; top: 3px; left: 3px;
      background: var(--bfx-knob); box-shadow: var(--bfx-knob-shadow); transition: transform .15s ease;
    }
    .opt input:checked + .tr { background: var(--bfx-toggle-on); box-shadow: var(--bfx-toggle-on-shadow); }
    .opt input:checked + .tr::before { transform: translateX(18px); background: #FFFFFF; }
    .opt input:focus-visible + .tr { outline: 2px solid var(--bfx-ring); outline-offset: 3px; }
    .opt input:disabled + .tr { opacity: .6; }
    .opt .ot { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .opt .ot b { font: 700 14px/1.25 var(--bfx-font); letter-spacing: .03em; text-transform: uppercase; }
    .opt .ot span { font: 400 13px/1.45 var(--bfx-font); color: var(--bfx-lead); }
    .opt.is-danger input:checked + .tr { background: var(--bfx-danger); box-shadow: inset 0 0 0 1px var(--bfx-danger-ring), var(--bfx-shadow-block); }
    details.adv summary {
      cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 2px;
      font: 700 12px/1 var(--bfx-font); letter-spacing: .12em; text-transform: uppercase; color: var(--bfx-text-2);
    }
    details.adv summary::-webkit-details-marker { display: none; }
    details.adv summary svg { width: 14px; height: 14px; transition: transform .15s ease; }
    details.adv[open] summary svg { transform: rotate(90deg); }
    @media (hover: hover) { details.adv summary:hover { color: var(--bfx-text); } }
    details.adv .opt { margin-top: 8px; }

    /* lista de sub-etapas (passos 3 e 4) */
    .tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .tasks li {
      display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: var(--bfx-r-chip);
      font: 500 15px/1.3 var(--bfx-font); color: var(--bfx-text-3); transition: color .15s ease, background .15s ease;
    }
    .tasks li .ic { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bfx-hair); display: grid; place-items: center; flex: 0 0 auto; position: relative; }
    .tasks li .ic svg { width: 12px; height: 12px; display: none; }
    .tasks li .tx { flex: 1; }
    .tasks li .pc { font: 600 13px/1 var(--bfx-font-mono); color: var(--bfx-text-2); min-width: 40px; text-align: right; }
    .tasks li.is-active { color: var(--bfx-text); background: var(--bfx-sub); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-sub); }
    .tasks li.is-active .ic { border-color: var(--bfx-accent); border-top-color: transparent; }
    .tasks li.is-done { color: var(--bfx-text-2); }
    .tasks li.is-done .ic { border-color: var(--bfx-ok); background: color-mix(in srgb, var(--bfx-ok) 16%, transparent); color: var(--bfx-ok); }
    .tasks li.is-done .ic svg { display: block; }
    .tasks li.is-skip { opacity: .5; text-decoration: line-through; }
    .tasks li.is-fail { color: var(--bfx-text); }
    .tasks li.is-fail .ic { border-color: var(--bfx-err); background: color-mix(in srgb, var(--bfx-err) 16%, transparent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hold {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--bfx-r-chip);
      background: color-mix(in srgb, var(--bfx-warn) 11%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bfx-warn) 38%, transparent);
      font: 600 14px/1.4 var(--bfx-font); color: var(--bfx-text);
    }
    .hold svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--bfx-warn); }

    /* ações: a fileira principal (o botão-herói + Configurações) e, embaixo, a
       barra secundária (USB Host | Trocar de controladora) */
    .actions { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--bfx-divider); }
    .actions:empty { display: none; }
    .actions-main { display: flex; flex-wrap: wrap; align-items: stretch; gap: 12px; }
    /* botões (§6 Botões): levantado por padrão; ação principal no laranja de
       ação (texto branco ~5:1); o botão grande do passo é o herói */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 0 22px; border: 0; border-radius: var(--bfx-r-btn); cursor: pointer;
      background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-block); color: var(--bfx-text);
      font: 700 13px/1.15 var(--bfx-font); letter-spacing: .1em; text-transform: uppercase;
      transition: background .15s ease, box-shadow .15s ease, filter .15s ease, opacity .15s ease;
    }
    .btn svg { width: 20px; height: 20px; flex: 0 0 auto; }
    .btn span { text-wrap: balance; }
    .btn svg.chev { width: 18px; height: 18px; margin-left: 2px; opacity: .9; }
    .btn.is-primary { background: var(--bfx-action); box-shadow: var(--bfx-accent-lift); color: var(--bfx-on-accent); }
    .actions-main .btn.is-primary {
      flex: 1 1 240px; min-height: 64px; padding: 0 26px;
      background: var(--bfx-hero); box-shadow: var(--bfx-accent-lift);
      font: 800 15.5px/1.15 var(--bfx-font); letter-spacing: .05em; text-shadow: 0 1px 1px rgba(0,0,0,.18);
    }
    .actions-main .btn.is-primary svg { width: 22px; height: 22px; }
    .actions-main .btn.is-ghost { flex: 0 0 auto; min-height: 64px; }
    .btn.is-link { background: none; box-shadow: none; min-height: 40px; padding: 0 12px; border-radius: var(--bfx-r-sm); color: var(--bfx-text-2); font: 600 12px/1 var(--bfx-font); letter-spacing: .1em; }
    @media (hover: hover) {
      .btn:not(.is-primary):not(.is-link):not(.is-dgr):not(:disabled):hover { background: var(--bfx-raised-hover); box-shadow: inset 0 0 0 1px var(--bfx-hair-hover), var(--bfx-shadow-block); }
      .btn:is(.is-primary, .is-dgr):not(:disabled):hover { filter: brightness(1.07); }
      .btn.is-link:hover { color: var(--bfx-text); }
    }
    .btn:not(:disabled):active { filter: var(--bfx-press); }
    .btn:disabled { cursor: not-allowed; opacity: .45; }
    @keyframes cta-pulse {
      0%, 100% { box-shadow: var(--bfx-accent-lift), 0 0 0 0 rgba(252,99,55,.42); }
      50% { box-shadow: var(--bfx-accent-lift), 0 0 0 12px rgba(252,99,55,0); }
    }
    /* barra secundária: um trilho afundado; o item em destaque é a pastilha levantada */
    .abar {
      display: flex; align-items: center; gap: 6px; padding: 5px; flex-wrap: wrap; border-radius: var(--bfx-r-rail);
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
    }
    .abar .sep { width: 1px; height: 26px; background: var(--bfx-divider); margin: 0 4px; }
    .abtn {
      display: inline-flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 16px; border: 0; border-radius: var(--bfx-r-seg); cursor: pointer;
      background: transparent; color: var(--bfx-text-2);
      font: 600 12.5px/1 var(--bfx-font); letter-spacing: .1em; text-transform: uppercase;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    }
    .abtn svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .abtn span { white-space: nowrap; }
    @media (hover: hover) { .abtn:not(.is-hi):hover:not(:disabled) { color: var(--bfx-text); background: rgba(255,255,255,.05); } }
    .abtn.is-hi { background: var(--bfx-seg-on); box-shadow: var(--bfx-shadow-seg); color: var(--bfx-text); }
    .abtn:not(:disabled):active { filter: var(--bfx-press); }
    .abtn:disabled { opacity: .45; cursor: not-allowed; }

    /* avisos (§6 Aviso): caixa tingida pela cor do estado, texto claro */
    .note { margin: 0; font: 400 14px/1.5 var(--bfx-font); color: var(--bfx-text-3); }
    .note a { color: var(--bfx-text-2); }
    .errbox, .okbox, .warnbox {
      --k: var(--bfx-err);
      border-radius: var(--bfx-r-chip); padding: 13px 15px;
      background: color-mix(in srgb, var(--k) 11%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--k) 38%, transparent);
      font: 400 14.5px/1.5 var(--bfx-font); color: var(--bfx-text);
    }
    .okbox { --k: var(--bfx-ok); }
    .warnbox { --k: var(--bfx-warn); }
    .errbox code { font: 500 13px/1.4 var(--bfx-font-mono); color: var(--bfx-text); word-break: break-word; }
    .okbox ul, .errbox ul { margin: 6px 0 0; padding-left: 18px; }

    /* janelas (USB Host · status e ferramentas; Configurações): §6 Janela */
    .hdlg {
      width: min(94vw, 740px); padding: 0; border: 1px solid var(--bfx-hair); border-radius: var(--bfx-r-modal);
      background: var(--bfx-modal); color: var(--bfx-text); box-shadow: var(--bfx-shadow-modal);
      -webkit-backdrop-filter: var(--bfx-modal-filter); backdrop-filter: var(--bfx-modal-filter);
    }
    .hdlg::backdrop { background: var(--bfx-veil); -webkit-backdrop-filter: var(--bfx-veil-filter); backdrop-filter: var(--bfx-veil-filter); }
    .hdlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 22px 14px; }
    .hdlg-head h2 { margin: 9px 0 0; font: 700 20px/1.1 var(--bfx-font); letter-spacing: -.01em; text-transform: uppercase; }
    .hdlg-head .btn { min-height: 44px; padding: 0 18px; border-radius: var(--bfx-r-pill); font-size: 12px; }
    .hdlg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 4px 22px 14px; }
    .hrow {
      display: flex; flex-direction: column; gap: 6px; padding: 11px 13px; border-radius: var(--bfx-r-chip); min-width: 0;
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
    }
    .hrow.is-wide { grid-column: 1 / -1; }
    .hrow span { font: 600 10px/1 var(--bfx-font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--bfx-text-3); }
    .hrow b { font: 600 15px/1.3 var(--bfx-font); overflow-wrap: anywhere; }
    .hrow b.is-ok { color: var(--bfx-ok); } .hrow b.is-warn { color: var(--bfx-warn); } .hrow b.is-new { color: var(--bfx-accent-ink); }
    .hdlg-tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 22px 10px; }
    .hdlg-tools .btn { min-height: 44px; padding: 0 14px; font-size: 11.5px; }
    .hdlg-tools .btn svg { width: 16px; height: 16px; }
    .hdlg-msg { min-height: 22px; padding: 4px 22px 22px; font: 400 14.5px/1.5 var(--bfx-font); color: var(--bfx-text-2); }
    .hdlg-msg.is-ok { color: var(--bfx-ok); } .hdlg-msg.is-warn { color: var(--bfx-warn); }
    .hdlg-msg .btn { margin-top: 10px; min-height: 44px; padding: 0 16px; font-size: 12px; }
    .hdlg-msg .btn svg { width: 16px; height: 16px; }
    .hdlg.is-cfg { width: min(94vw, 560px); }
    @keyframes bfx-pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

    /* FERRAMENTAS: uma TELA no lugar do assistente (data-view="tools" no <html>):
       a barra de ícones grandes em cima (VOLTAR · HOST · CONTROLADORA ·
       DIAGNÓSTICOS) e a seção escolhida num card de vidro embaixo */
    html[data-view="tools"] .wiz { display: none; }
    .tools { position: relative; z-index: 1; width: 100%; max-width: var(--w); }
    .tools[hidden] { display: none; }
    .tnav {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 6px;
      border: 1px solid var(--bfx-edge); border-radius: var(--bfx-r-bar);
      background: var(--bfx-glass); box-shadow: var(--bfx-shadow-bar);
      -webkit-backdrop-filter: var(--bfx-blur); backdrop-filter: var(--bfx-blur);
    }
    .tnav-b {
      appearance: none; -webkit-appearance: none; cursor: pointer; border: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      min-height: 112px; padding: 14px 8px 12px; border-radius: var(--bfx-r-block);
      background: transparent; color: var(--bfx-text-3);
      font: 700 11.5px/1 var(--bfx-font-mono); letter-spacing: .14em; text-transform: uppercase;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    }
    .tnav-b svg { width: 40px; height: 40px; }
    @media (hover: hover) { .tnav-b:not(.is-on):not(.is-back):hover:not(:disabled) { color: var(--bfx-text); background: rgba(255,255,255,.05); } }
    .tnav-b:disabled { opacity: .45; cursor: not-allowed; }
    .tnav-b.is-back { color: var(--bfx-text); background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-block); }
    @media (hover: hover) { .tnav-b.is-back:hover:not(:disabled) { background: var(--bfx-raised-hover); } }
    .tnav-b.is-on { color: var(--bfx-on-accent); background: var(--bfx-accent-grad); box-shadow: var(--bfx-accent-lift); }
    .tnav-b:not(:disabled):active { filter: var(--bfx-press); }
    .tpage {
      margin-top: 16px; padding: 24px 24px 20px; border: 1px solid var(--bfx-hair); border-radius: var(--bfx-r-card);
      background: var(--bfx-card); box-shadow: var(--bfx-shadow-card);
      -webkit-backdrop-filter: var(--bfx-blur); backdrop-filter: var(--bfx-blur);
    }
    .thead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--bfx-divider); }
    .thead-ic {
      width: 72px; height: 72px; border-radius: var(--bfx-r-sub); display: grid; place-items: center; color: var(--bfx-text);
      background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair), var(--bfx-shadow-block);
    }
    .thead-ic svg { width: 32px; height: 32px; }
    .thead-t { min-width: 0; }
    .thead-t h1 { margin: 10px 0 8px; font: 700 26px/1.1 var(--bfx-font); letter-spacing: .01em; text-transform: uppercase; }
    .thead-t p { margin: 0; font: 400 15px/1.5 var(--bfx-font); color: var(--bfx-lead); }
    .thead-st {
      display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-radius: var(--bfx-r-chip); text-align: right;
      background: var(--bfx-well); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
    }
    .thead-st span { font: 600 10px/1 var(--bfx-font-mono); letter-spacing: .16em; color: var(--bfx-text-3); }
    .thead-st b { font: 600 15px/1.25 var(--bfx-font); white-space: nowrap; }
    .tgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tmsg { min-height: 24px; margin-top: 16px; font: 400 15px/1.55 var(--bfx-font); color: var(--bfx-text-2); }
    .tmsg.is-ok { color: var(--bfx-ok); } .tmsg.is-warn { color: var(--bfx-warn); }
    .tmsg .btn { margin-top: 10px; min-height: 44px; padding: 0 16px; font-size: 12px; }
    .tmsg .btn svg { width: 16px; height: 16px; }
    /* cada ferramenta é uma linha (§6 Linha): ícone neutro, título, explicação e o botão */
    .trow {
      display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--bfx-r-sub);
      background: var(--bfx-sub); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-sub);
    }
    .trow .ti {
      width: 44px; height: 44px; border-radius: var(--bfx-r-chip); display: grid; place-items: center; color: var(--bfx-text-2);
      background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-block);
    }
    .trow .ti svg { width: 21px; height: 21px; }
    .trow.is-danger .ti { color: var(--bfx-err); background: color-mix(in srgb, var(--bfx-err) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bfx-err) 40%, transparent); }
    .trow .tt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .trow .tt b { font: 700 15px/1.3 var(--bfx-font); letter-spacing: 0; }
    .trow .tt span { font: 400 13px/1.45 var(--bfx-font); color: var(--bfx-lead); }
    .trow .tt .why { font-weight: 500; color: var(--bfx-warn); }
    /* indisponível: fica à vista, apagada, e o motivo continua legível (§10) */
    .trow.is-off .ti, .trow.is-off .tt > b, .trow.is-off .tt > span:not(.why) { opacity: .5; }
    .trow .btn { min-height: 44px; padding: 0 14px; font-size: 11.5px; white-space: nowrap; }
    .trow .btn svg { width: 16px; height: 16px; }
    .trow .btn.is-dgr:not(:disabled) { background: var(--bfx-danger); box-shadow: inset 0 0 0 1px var(--bfx-danger-ring), var(--bfx-shadow-block); color: #fff; }
    @media (max-width: 960px) { .tgrid { grid-template-columns: 1fr; } .thead { grid-template-columns: auto minmax(0, 1fr); } .thead-st { grid-column: 1 / -1; text-align: left; } .thead-st b { white-space: normal; } }
    @media (max-width: 600px) {
      /* 4 numa linha não cabe o rótulo CONTROLADORA: duas fileiras de dois */
      .tnav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tnav-b { min-height: 84px; gap: 8px; padding: 10px 6px 9px; font-size: 10.5px; letter-spacing: .08em; }
      .tnav-b svg { width: 30px; height: 30px; }
      .tpage { padding: 18px 14px 16px; }
      .thead { gap: 14px; } .thead-ic { width: 56px; height: 56px; border-radius: var(--bfx-r-btn); } .thead-ic svg { width: 26px; height: 26px; }
      .thead-t h1 { font-size: 21px; } .thead-t p { font-size: 14px; }
      .trow { grid-template-columns: 40px minmax(0, 1fr); } .trow .ti { width: 40px; height: 40px; } .trow .btn { grid-column: 1 / -1; justify-content: center; }
    }
    .cfg-body { display: flex; flex-direction: column; gap: 10px; padding: 4px 22px 22px; }
    .cfg-body .adv { margin-top: 2px; }
    @media (max-width: 600px) { .hdlg-grid { grid-template-columns: 1fr; } .hdlg-head, .hdlg-grid, .hdlg-tools, .hdlg-msg, .cfg-body { padding-left: 16px; padding-right: 16px; } }

    /* downloads e páginas (dentro de Opções avançadas, no popup Configurações) */
    .adv-h { font: 600 10.5px/1 var(--bfx-font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--bfx-text-3); margin: 16px 2px 8px; }
    .more { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .res {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--bfx-r-chip); text-decoration: none; min-width: 0;
      background: var(--bfx-sub); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-sub);
      transition: background .15s ease, box-shadow .15s ease;
    }
    @media (hover: hover) { .res:hover { background: var(--bfx-raised-hover); box-shadow: inset 0 0 0 1px var(--bfx-hair-hover), var(--bfx-shadow-block); } }
    .res .ri {
      width: 40px; height: 40px; border-radius: var(--bfx-r-sm); flex: 0 0 auto; display: grid; place-items: center; color: var(--bfx-text-2);
      background: var(--bfx-raised); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-block);
    }
    .res .ri svg { width: 20px; height: 20px; }
    .res .rt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .res .rt b { font: 700 14.5px/1.25 var(--bfx-font); }
    .res .rt i { font: 400 12.5px/1.3 var(--bfx-font); font-style: normal; color: var(--bfx-lead); }
    .res .ra { margin-left: auto; color: var(--bfx-text-3); display: flex; flex: 0 0 auto; } .res .ra svg { width: 18px; height: 18px; }

    /* rodapé: registro técnico à esquerda, assinatura à direita */
    .footbar { position: relative; z-index: 1; width: 100%; max-width: var(--w); margin-top: 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logwrap { flex: 1 1 420px; min-width: 0; margin: 0; }
    .logwrap summary {
      cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 9px; padding: 10px 6px; border-radius: var(--bfx-r-sm);
      font: 600 12px/1 var(--bfx-font); letter-spacing: .12em; text-transform: uppercase; color: var(--bfx-text-2);
    }
    @media (hover: hover) { .logwrap summary:hover { color: var(--bfx-text); } }
    .logwrap summary::-webkit-details-marker { display: none; }
    .logwrap summary svg { width: 17px; height: 17px; transition: transform .15s ease; }
    .logwrap[open] summary svg { transform: rotate(180deg); }
    .logbox {
      margin-top: 6px; max-height: 240px; overflow: auto; padding: 14px 16px; border-radius: var(--bfx-r-field);
      background: var(--bfx-well-deep); box-shadow: inset 0 0 0 1px var(--bfx-hair-in), var(--bfx-shadow-well);
      font: 400 11.5px/1.6 var(--bfx-font-mono); color: var(--bfx-text-2); white-space: pre-wrap; word-break: break-word;
    }
    .logtools { display: flex; gap: 8px; margin-top: 6px; }
    .footer { margin: 0; padding: 10px 6px; display: flex; align-items: center; gap: 10px; white-space: nowrap; flex-wrap: wrap; font: 500 13px/1 var(--bfx-font); color: var(--bfx-text-3); }
    .footer .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--bfx-text-3); opacity: .7; }
    .footer svg { width: 20px; height: 14px; border-radius: 2px; }

    /* barra de rolagem fina (§9), só com mouse */
    @media (pointer: fine) {
      ::-webkit-scrollbar { width: 12px; height: 12px; background: transparent; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
      ::-webkit-scrollbar-thumb { background-color: var(--bfx-sb-thumb); background-clip: padding-box; border: 3px solid transparent; border-radius: 999px; min-height: 40px; }
      ::-webkit-scrollbar-thumb:hover { background-color: var(--bfx-sb-thumb-hover); }
      ::-webkit-scrollbar-thumb:active { background-color: color-mix(in srgb, var(--bfx-accent) 70%, transparent); }
    }

    /* ─── ILUSTRAÇÕES (updater_art.js): o aparelho desenhado, num mostrador ─── */
    .ar {
      --ar-top: #272b32; --ar-face: #14161a; --ar-face-lip: rgba(255,255,255,.11); --ar-hole: #040507;
      --ar-metal: #c6cbd3; --ar-tag: #eef0f3; --ar-tag-ink: #14161a; --ar-screen: #0a0b0e; --ar-screen-lit: #0e1b2e;
      --ar-boot: #3a3e46; --ar-boot-hi: rgba(255,255,255,.15); --ar-cable: #555a64;
      --ar-accent: var(--bfx-accent); --ar-ok: var(--bfx-ok); --ar-err: var(--bfx-err);
      --ar-laptop: #5a606a; --ar-laptop-scr: #12233a; --ar-dash: rgba(238,241,246,.4);
      border-radius: var(--bfx-r-chip); overflow: hidden;
    }
    .ar .ar-top { fill: var(--ar-top); }
    .ar .ar-face { fill: var(--ar-face); }
    .ar .ar-face-lip { stroke: var(--ar-face-lip); stroke-width: .5; }
    .ar .ar-hole { fill: var(--ar-hole); }
    .ar .ar-metal { fill: var(--ar-metal); }
    .ar .ar-tag rect { fill: var(--ar-tag); }
    .ar .ar-tag text { fill: var(--ar-tag-ink); font: 800 6.6px/1 var(--bfx-font-mono); letter-spacing: .06em; }
    .ar .ar-tag.is-hot rect { fill: var(--ar-accent); }
    .ar .ar-tag.is-hot text { fill: #fff; }
    .ar .ar-target { fill: color-mix(in srgb, var(--ar-accent) 14%, transparent); stroke: var(--ar-accent); stroke-width: 1; }
    .ar .ar-cable { fill: none; stroke: var(--ar-cable); stroke-width: 4.4; stroke-linecap: round; }
    .ar .ar-boot { fill: var(--ar-boot); }
    .ar .ar-boot-hi { fill: var(--ar-boot-hi); }
    .ar .ar-tip { fill: var(--ar-metal); }
    .ar .ar-bezel { fill: #15171b; stroke: rgba(255,255,255,.08); stroke-width: 1; }
    .ar .ar-screen { fill: var(--ar-screen); }
    .ar .ar-screen-glow { fill: var(--ar-screen-lit); }
    .ar .ar-tile { opacity: .92; }
    .ar .ar-tile.is-a { fill: #E5484D; } .ar .ar-tile.is-b { fill: #F5B84A; } .ar .ar-tile.is-c { fill: #3B82F6; }
    .ar .ar-tile.is-d { fill: #8B5CF6; } .ar .ar-tile.is-e { fill: #22C55E; } .ar .ar-tile.is-f { fill: #EE5A31; }
    .ar .ar-arrow { fill: none; stroke: var(--ar-accent); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .ar .ar-badge circle { fill: var(--ar-ok); stroke: rgba(0,0,0,.25); stroke-width: 1; }
    .ar .ar-badge.is-err circle { fill: var(--ar-err); }
    .ar .ar-badge path { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .ar .ar-laptop rect, .ar .ar-laptop path { fill: var(--ar-laptop); }
    .ar .ar-laptop .ar-laptop-scr { fill: var(--ar-laptop-scr); }
    .ar .ar-dash { fill: none; stroke: var(--ar-dash); stroke-width: 1.8; stroke-dasharray: 3 4; stroke-linecap: round; }
    .ar .ar-cloud path { fill: #3b4150; stroke: rgba(255,255,255,.12); stroke-width: .8; }
    .ar .ar-cloud .ar-cloud-arrow { fill: none; stroke: #fff; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .ar .ar-cloud-dots circle { fill: var(--ar-accent); opacity: 0; }
    .ar .ar-dl-track { fill: rgba(255,255,255,.1); }
    .ar .ar-dl-fill { fill: var(--ar-accent); transform-origin: 124px 178px; transform: scaleX(.6); }
    .ar .ar-chip rect { fill: #1d2430; stroke: var(--ar-accent); stroke-width: 1.8; }
    .ar .ar-chip .ar-chip-pins { fill: none; stroke: var(--ar-accent); stroke-width: 1.6; stroke-linecap: round; }
    .ar .ar-chip .ar-chip-arrow { fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ar .ar-chip .ar-chip-halo { fill: color-mix(in srgb, var(--ar-accent) 22%, transparent); }
    .ar .ar-data circle { fill: var(--ar-accent); opacity: 0; }
    .ar.is-backup .ar-data circle, .ar.is-scan .ar-data circle { fill: var(--bfx-select); }
    .ar.is-restore .ar-data circle { fill: var(--ar-ok); }
    .ar .ar-stay { fill: none; stroke: var(--ar-accent); stroke-width: 1.3; opacity: .85; }
    .ar .ar-plug.is-gear .ar-boot, .ar .ar-gear { fill: #2c4a6a; }
    .ar .ar-gear-knob { fill: #a6bdd4; }
    .ar .ar-plug.anim-out-first { transform: translateY(-16px); }
    .ar.is-hostFlash .ar-data circle { fill: var(--bfx-info); }
    .ar .ar-lbl rect { fill: rgba(255,255,255,.07); stroke: rgba(255,255,255,.14); stroke-width: .8; }
    .ar .ar-lbl .l1 { fill: #fff; font: 700 10px var(--bfx-font); letter-spacing: .04em; }
    .ar .ar-lbl .l2 { fill: #9aa4ba; font: 600 7px var(--bfx-font); letter-spacing: .06em; }
    .ar .seq-a { opacity: 1; } .ar .seq-b { opacity: 0; }
    .ar .ar-screen-lit.anim-reboot { opacity: .35; }

    /* MOVIMENTO (§8): entrada curta sempre; tudo o que é contínuo (pulsar,
       girar, as ilustrações) só sem "reduzir movimento". Sem animação, o
       estado continua legível pela cor e pela forma. */
    @media (prefers-reduced-motion: no-preference) {
      .frame .ar, .plate, .ring, .pdlg { animation: fade-in .22s cubic-bezier(.2,.8,.2,1) both; }

  <script type="module">
    // ══════════════════════════════════════════════════════════════════
    // FLUXO EM 5 PASSOS. A LÓGICA DE GRAVAÇÃO (porta, reset por DTR/RTS e
    // 1200 bps, gate de PID, fix de porta fantasma, bins por chip, reset
    // final do S3 por watchdog, backup automático) é a MESMA validada no
    // hardware pela página anterior — só a camada que pinta o DOM e a
    // identificação do modelo/versão pelo cabo são novas. Não mexer no
    // núcleo connect/flash sem motivo.
    //
    // ?demo=1      percorre o fluxo com uma controladora FALSA (updater_demo.js)
    // ?demo=auth   idem, com a porta nova exigindo autorização
    // ?demo=same   idem, com a controladora já na versão publicada
    // ?demo=s2|boot|legacy|mute|fail   outras situações (ver updater_demo.js)
    // ?demo=hostok|hostmute|hostonly     o USB HOST em dia / mudo / só ele desatualizado
    // ══════════════════════════════════════════════════════════════════
    import { ESPLoader as RealESPLoader, Transport as RealTransport } from "./esptool-bundle.js";
    import * as AB from "./autobackup.js";
    import { art } from "./updater_art.js";

        { file: "bin_S3/littlefs.bin", address: 0x720000 } ] },

    const S = {
      mode: "idle",        // idle | reading | ready | prepare | await-port | flash | restore | done | error
      step: "connect",     // chave do passo no trilho (S.rail)
      device: null,        // SerialPort
      lastPortInfo: null,

      wantHost: true,      // opção "Atualizar também o USB Host"

      flashSize: "keep",
      transport: null, esploader: null,
      pendingBackup: null, recoveredBackup: null,

    // UI

      browser: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 3a9 9 0 0 1 7.8 4.5L13.5 9"/><path d="M3.9 16.5 9 13.5"/><path d="M12 21l1.5-6"/></svg>',

    function setMode(mode) {
      S.mode = mode;
      root.setAttribute("data-mode", mode);
      const pill = {
        idle: ["Aguardando a controladora", ""], reading: ["Identificando…", "is-busy"], ready: ["Controladora conectada", "is-ok"],
        prepare: ["Preparando…", "is-busy"], "await-port": ["Autorize a porta", "is-busy"], flash: ["Gravando…", "is-busy"],
        restore: ["Devolvendo os dados…", "is-busy"], done: ["Atualizada", "is-ok"], error: ["Algo deu errado", "is-err"],
      }[mode] || ["", ""];
      els.pillText.textContent = pill[0];
      els.pillState.className = "pill " + pill[1];
    }
    // O trilho é montado da lista S.rail: 5 passos de sempre, mais USB HOST
    // (entre GRAVAR e PRONTO) quando o host também vai ser atualizado, ou só
    // CONECTAR · IDENTIFICAR · USB HOST · PRONTO quando é só ele.
    const RAIL_LABEL = { connect: "CONECTAR", identify: "IDENTIFICAR", prepare: "PREPARAR", flash: "GRAVAR", host: "USB HOST", done: "PRONTO" };
    function setRail(keys) {
      S.rail = keys;
      const rail = $("rail");
      rail.style.setProperty("--n", String(keys.length));
      rail.innerHTML = keys.map((k, i) => `<div class="st" data-k="${k}"><div class="n"><span>${i + 1}</span>${svgIcon.check}</div><div class="t">${RAIL_LABEL[k]}</div></div>`).join("");
      if (S.step && keys.includes(S.step)) setStep(S.step);
    }
    function setStep(key) {
      if (!S.rail.includes(key)) {
        // o passo pedido não está no trilho atual (ex.: HOST numa rodada só de
        // controladora): acrescenta antes do PRONTO
        const keys = S.rail.filter((k) => k !== "done"); keys.push(key, "done"); setRail(keys);
      }
      S.step = key;
      const n = S.rail.indexOf(key);
      root.setAttribute("data-step", String(n + 1));
      document.querySelectorAll(".rail .st").forEach((el, i) => {
        el.classList.toggle("is-active", i === n);
        el.classList.toggle("is-done", i < n);
      });
      els.eyebrow.textContent = key === "done" ? "CONCLUÍDO" : `PASSO ${n + 1} DE ${S.rail.length}`;
      if (els.copyIc) els.copyIc.innerHTML = svgIcon[STEP_ICON[key] || "device"];
    }
    // o ícone redondo ao lado do título, por passo (a tela pode trocar por setCopy({ icon }))
    const STEP_ICON = { connect: "cable", identify: "device", prepare: "download", flash: "bolt", host: "usb", done: "check" };
    function setCopy({ title, desc, extra, caption, icon }) {
      if (icon !== undefined && els.copyIc) els.copyIc.innerHTML = svgIcon[icon] || "";
      if (title !== undefined) els.title.innerHTML = title;
      if (desc !== undefined) els.desc.innerHTML = desc;
      if (extra !== undefined) els.extra.innerHTML = extra;
      if (caption !== undefined) els.caption.innerHTML = caption;
    }
    // Botões da coluna de texto. Cada item: { label, kind, onClick, pulse, disabled, icon }
    // kind primary/ghost vão na fileira principal; kind "bar" (destacado) e
    // "link" vão na barra secundária embaixo dela (USB Host | Trocar de
    // controladora). `chev` põe a seta no fim do botão principal.
    function setActions(list) {
      els.actions.innerHTML = "";
      const main = document.createElement("div"); main.className = "actions-main";
      let bar = null;
      for (const b of list) {
        if (!b) continue;
        const kind = b.kind || "primary";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.disabled = !!b.disabled;
        if (b.id) btn.id = b.id;
        btn.addEventListener("click", b.onClick);
        if (kind === "bar" || kind === "link") {
          if (!bar) { bar = document.createElement("div"); bar.className = "abar"; }
          else { const sep = document.createElement("span"); sep.className = "sep"; sep.setAttribute("aria-hidden", "true"); bar.appendChild(sep); }
          btn.className = "abtn" + (kind === "bar" ? " is-hi" : "");
          btn.innerHTML = (b.icon ? svgIcon[b.icon] : "") + "<span>" + esc(b.label) + "</span>";
          bar.appendChild(btn);
          continue;
        }
        btn.className = "btn is-" + kind + (b.pulse ? " is-pulse" : "");
        btn.innerHTML = (b.icon ? svgIcon[b.icon] : "") + "<span>" + esc(b.label) + "</span>" + (b.chev ? svgIcon.chev : "");
        main.appendChild(btn);
      }
      if (main.childElementCount) els.actions.appendChild(main);
      if (bar) els.actions.appendChild(bar);
    }
    function showArt(kind, opts) {
      els.frame.innerHTML = art(kind, Object.assign({ deviceC: deviceIsUsbC() }, opts || {}));
    }
    function showFrameHtml(html) { els.frame.innerHTML = html; }

    // O anel de progresso do passo 4. `tone` = fw | app | data | wait.
    function showRing(tone, label, sub) {
      els.frame.innerHTML = `<div class="ring is-${tone}" id="ring">
        <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="bar" cx="60" cy="60" r="54"/></svg>
        <div class="inner"><div class="pct" id="ringPct"><span>0</span><sup>%</sup></div><div class="lab" id="ringLab">${esc(label)}</div><div class="sublab" id="ringSub">${esc(sub || "")}</div></div></div>`;
    }
    function setRing(pct, tone, label, sub) {
      const ring = $("ring");
      if (!ring) return;
      if (tone) ring.className = "ring is-" + tone;
      const bar = ring.querySelector(".bar");
      const p = Math.max(0, Math.min(100, pct | 0));
      if (tone !== "wait") bar.style.strokeDashoffset = String(339.3 * (1 - p / 100));
      $("ringPct").firstChild.textContent = String(p);
      if (label !== undefined) $("ringLab").textContent = label;
      if (sub !== undefined) $("ringSub").textContent = sub;
    }

    // Lista de sub-etapas dos passos 3/4 (coluna de texto).
    let taskDefs = [];
    function showTasks(defs) {
      taskDefs = defs;
      els.extra.innerHTML = `<ul class="tasks" id="tasks">` + defs.map((d) =>
        `<li data-k="${d.k}" class="${d.skip ? "is-skip" : ""}"><span class="ic">${svgIcon.check}</span><span class="tx">${esc(d.label)}</span><span class="pc"></span></li>`).join("") + `</ul>` +
        `<div class="hold">${svgIcon.warn}<span>Não desligue a controladora nem solte o cabo até o fim.</span></div>`;
    }
    function task(k, state, pct) {
      const li = document.querySelector(`#tasks li[data-k="${k}"]`);
      if (!li) return;
      li.classList.remove("is-active", "is-done", "is-skip", "is-fail");
      if (state) li.classList.add("is-" + state);
      li.querySelector(".pc").textContent = (typeof pct === "number") ? pct + "%" : (pct || "");
    }
    function taskDoneUpTo(k) {
      for (const d of taskDefs) { if (d.k === k) break; const li = document.querySelector(`#tasks li[data-k="${d.k}"]`); if (li && !li.classList.contains("is-skip")) task(d.k, "done"); }
    }

    // ══════════════════════════════════════════════════════════════════
    // MODELO / VERSÕES
    // ══════════════════════════════════════════════════════════════════
    const LEGACY = { "BFMIDI-3 6S": "BFMIDI-3 6SW+", "BFMIDI-3 7SW+V2": "BFMIDI-S3 8SW+", "BFMIDI-3 8SW+": "BFMIDI-S3 8SW+", "BFMIDI-3 NANO+ V2": "BFMIDI-S3 NANO+" };
    const SWITCHES = { "7S": 8, "7SW+": 8, "8SW+": 8, "4S": 4, "NANO": 6, "NANO+": 6, "MICRO": 4, "6S": 6, "6SW+": 6 };
    function canonicalBoard(b) { const s = String(b || "").trim(); return LEGACY[s] || s; }
    function prettyBoard(b) {
      const s = canonicalBoard(b);
      const m = /^BFMIDI-(S3|1|2|3)\s+(.+)$/i.exec(s);
      if (!m) return { family: "BFMiDi", variant: s || "—", switches: 6, slim: false, raw: s };
      const fam = m[1].toUpperCase() === "S3" ? "BFMiDi S3" : "BFMiDi " + m[1];
      const variant = m[2].replace(/_[A-Z]\d$/i, "").trim();          // 7S_A1 → 7S
      return { family: fam, variant, switches: SWITCHES[variant.toUpperCase()] || 6, slim: /^4S$/i.test(variant), raw: s };
    }
    // BFMiDi S3: DEVICE USB-B. BFMiDi 1, 2 e 3: USB-C. Sem modelo: null (alterna).
    function deviceIsUsbC() {
      const b = S.info && S.info.board;
      if (!b) return null;
      return !canonicalBoard(b).startsWith("BFMIDI-S3");
    }
    function cmpVersions(a, b) {
      const parts = (v) => String(v || "").split("+")[0].split(".").map((n) => parseInt(n, 10) || 0);
      const pa = parts(a), pb = parts(b), len = Math.max(pa.length, pb.length);
      for (let i = 0; i < len; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d; }
      return 0;
    }
    function latestFor(chip) {
      const m = S.manifest;
      if (!m) return "";
      return (chip && m.fw && m.fw[chip] && m.fw[chip].version) || m.version || "";
    }
    function notesFor(chip) {
      const m = S.manifest;
      return (m && m.fw && m.fw[chip] && m.fw[chip].notes) || "";
    }
    function flashListFor(chip) {
      const m = S.manifest;
      const list = m && m.fw && m.fw[chip] && Array.isArray(m.fw[chip].flash) ? m.fw[chip].flash : null;
      if (list && list.length) return list.map((f) => ({ file: f.file, address: f.address, size: f.size, sha256: f.sha256 }));
      return IMAGES_BY_CHIP[chip].files.map((f) => ({ file: f.file, address: f.address }));
    }

    function modelHasUsbHost(board) { const b = canonicalBoard(board); return b.includes("BFMIDI-3") || b.includes("BFMIDI-S3"); }
    // Host SEM versão (anterior ao 3.0) conta como mais antigo que qualquer
    // versão publicada — regra do produto.
    function hostNeedsUpdate(installed, available) { if (!available) return false; if (!installed) return true; return cmpVersions(installed, available) < 0; }
    async function loadHostManifest() {
      if (demo && demo.hostManifest) { S.hostManifest = demo.hostManifest(); return; }
      try {
        const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 8000);
        const r = await fetch(HOST_BASE + "version.json?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal });
        clearTimeout(timer);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const m = await r.json();
        if (m && m.version && Array.isArray(m.files) && m.files.length) { S.hostManifest = m; log("USB Host publicado: " + m.version); }
      } catch (e) { log("version.json do USB Host indisponível (" + e.message + ")."); }
    }
    async function loadManifest() {
      try {
        const r = await fetch("./version.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        S.manifest = await r.json();
        els.pubVer.textContent = "v" + (S.manifest.version || "?");
        log("Manifesto carregado: versão publicada " + S.manifest.version);
      } catch (e) {
        els.pubVer.textContent = "—";
        log("version.json indisponível (" + e.message + ") — usando o mapa de gravação embutido.");
      }
    }

    // ══════════════════════════════════════════════════════════════════
    // TELAS
    // ══════════════════════════════════════════════════════════════════
    function screenNeedBrowser() {
      setStep("connect"); setMode("idle");

      setCopy({
        title: "Abra esta página no <em>Chrome</em> ou <em>Edge</em>",

        extra: `<div class="tips"><span class="tip">${svgIcon.browser}Chrome ou Edge</span><span class="tip">${svgIcon.cable}Computador, não celular</span></div>`,
        caption: "Copie o endereço desta página e abra no Chrome ou no Edge.",
      });
      cfgCtx = { allowBackup: true, allowHost: false };

             <span class="tip">${svgIcon.browser}Chrome ou Edge</span>
           </div>`,

      });
      // Configurações (e as Opções avançadas, com os downloads) também antes de
      // conectar — pedido do dono, 29/out/2026. O que for escolhido aqui vale

      cfgCtx = { allowBackup: true, allowHost: false };
      setActions([
        { label: "Procurar a controladora", icon: "usb", onClick: () => connectFlow(true) },
        { label: "Configurações", kind: "ghost", icon: "gear", onClick: openCfgDialog },

    function screenReading() {
      setStep("identify"); setMode("reading");
      showArt("scan");
      setCopy({
        title: "Identificando a controladora…",
        desc: "Lendo modelo e versões pelo cabo.",
        extra: "", caption: "",

      setActions([{ label: "Identificando…", disabled: true }]);

    // ── PLACA DE STATUS (quadro da esquerda nos passos 2 e 5) ──
    // Só fatos, em letra grande: modelo, chip, série e uma linha de versão por
    // peça (controladora, USB Host). Sem foto nem desenho do pedal — quem está
    // atualizando já sabe qual é a controladora dele (pedido do dono, 24/out).
    function versionBadge(kind) {
      const map = { update: ["is-new", "ATUALIZAÇÃO"], same: ["is-same", "EM DIA"], newer: ["is-unk", "VERSÃO DE TESTE"], unknown: ["is-new", "ATUALIZAÇÃO"],
        nolatest: ["is-unk", "SEM LISTA"], bootloader: ["is-unk", "MODO DE GRAVAÇÃO"], mute: ["is-unk", "SEM RESPOSTA"], done: ["is-same", "ATUALIZADO"], warn: ["is-unk", "CONFERIR"] };
      const [cls, txt] = map[kind] || ["is-unk", String(kind).toUpperCase()];
      const ico = cls === "is-new" ? svgIcon.upload : cls === "is-same" ? svgIcon.check : svgIcon.warn;
      return `<span class="badge ${cls}">${ico}${txt}</span>`;
    }
    // ícone e subtítulo de cada linha da placa
    const ROW_META = { "Controladora": ["chip", "Firmware principal do sistema"], "USB Host": ["usb", "Módulo de comunicação USB"] };
    // desenho estilizado da controladora no cabeçalho da placa (sem foto por
    // modelo: o mesmo desenho com o nome e o número de footswitches da placa)
    function plateDeviceSvg(fam, variant, switches) {
      const famParts = /^(BFMiDi)\s*(.*)$/.exec(fam || "") || [null, fam || "BFMiDi", ""];
      const n = Math.max(4, Math.min(6, switches || 6));
      const sw = Array.from({ length: n }, (_, i) => { const x = 40 + i * (160 / (n - 1)); return `<circle cx="${x.toFixed(1)}" cy="92" r="7"/>`; }).join("");
      return `<svg class="plate-dev" viewBox="0 0 240 130" aria-hidden="true">
        <defs>
          <linearGradient id="pdBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a303b"/><stop offset=".55" stop-color="#171c25"/><stop offset="1" stop-color="#0e1218"/></linearGradient>
          <linearGradient id="pdLed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A4C"/><stop offset="1" stop-color="#F0552F"/></linearGradient>
          <linearGradient id="pdScr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2a44"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
        </defs>
        <ellipse cx="120" cy="119" rx="104" ry="8" fill="rgba(0,0,0,.5)"/>
        <rect x="14" y="16" width="212" height="94" rx="16" fill="url(#pdBody)" stroke="rgba(255,255,255,.14)"/>
        <rect x="26" y="30" width="72" height="46" rx="6" fill="url(#pdScr)" stroke="rgba(255,255,255,.1)"/>
