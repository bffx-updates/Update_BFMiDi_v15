        log("host respondeu: " + (st ? (v || "sem versão") : (canVerify ? "não" : "sem controladora no cabo pra perguntar")));
        if (v && want && cmpVersions(v, want) === 0) {
          S.host.result = { outcome: "ok", version: v, from: S.host.version || "antigo" };
          S.host.version = v; S.host.need = false;
          task("hver", "done");
        } else if (v && want) {
          S.host.result = { outcome: "oldVersion", version: v, want }; task("hver", "fail");
        } else if (!canVerify) {
          S.host.result = { outcome: "direct", version: want, from: S.host.seen ? (S.host.version || "antigo") : "" };
          task("hver", "skip", "sem controladora"); setRing(100, "host", "USB HOST", "gravado");
        } else {
          S.host.result = { outcome: "unverified", version: want }; task("hver", "fail");
        }
        finishHostStage();
      } catch (err) {
        if (err && err.wrongDevice && !err.partial) {
          // a controladora na linha errada: nada gravado, escolhe de novo
          log("Porta errada no passo do host: " + err.message);
          S.badPorts.add(port);
          screenHostAwaitPort("Essa porta não é a do USB Host: " + err.message + ". Nada foi gravado. Escolha a outra linha.");
          return;
        }
        hostFail(err);
      }
    }
    function hostFail(err) {
      log("Erro no USB Host: " + (err && err.message));
      if (err && err.stack) log(err.stack);
      // Escrita que começou e não terminou = firmware incompleto; o host fica
      // no bootloader enquanto a BFMiDi estiver ligada, e a nova tentativa
      // pula o comando. Nada escrito = o estado é o de antes.
      if (err && err.partial) S.host.inRom = true;
      // O host não respondeu no ROM: a dica manda desligar e ligar a BFMiDi, e
      // aí ele volta ao firmware — a próxima tentativa precisa do comando de novo.
      if (err && err.hostNoSync) S.host.inRom = false;
      S.hostFailed = true;
      S.busy = false;
      hostScreenSet("off").catch(() => { });
      screenError(err);
      finishHostStage();
    }
    // Só o host (controladora já em dia, ou "Regravar o USB Host").
    async function startHostOnly() {
      if (S.busy) return;
      S.busy = true; S.hostFailed = false; S.host.direct = false;
      S.plan = { ctrl: false, host: true };
      setRail(["connect", "identify", "host", "done"]);
      await hostStage({ recovering: false });
      if (S.hostFailed) return;
      S.busy = false;
      screenDone();
    }


    // ══════════════════════════════════════════════════════════════════
    // USB HOST · STATUS E FERRAMENTAS (botão "USB Host" no passo 2)
    // ══════════════════════════════════════════════════════════════════
    // O status cru do módulo lido pela controladora (pedido novo a cada 3 s
    // enquanto o painel está aberto) e as ferramentas que fazem sentido com o
    // cabo DEVICE: reiniciar por comando (0x2A, host 3.1+), colocar em modo
    // de gravação (SysEx sem alvo — depois o cabo HOST grava), regravar o
    // firmware publicado e retomar um host que já ficou no ROM.
    const hostDlg = $("hostDlg");
    let hostDlgTimer = null, hostDlgBusy = false, hostDlgLast = null;
    function hostDlgMsg(html, cls) { const m = $("hostDlgMsg"); m.className = "hdlg-msg " + (cls || ""); m.innerHTML = html || ""; }
    function hostDlgRow(k, v, cls, wide) { return `<div class="hrow${wide ? " is-wide" : ""}"><span>${esc(k)}</span><b class="${cls || ""}">${esc(v)}</b></div>`; }
    function renderHostDlg(st) {
      const g = $("hostDlgGrid");
      if (!st) { g.innerHTML = hostDlgRow("Estado", S.ctl ? "sem resposta da controladora" : "controladora desconectada", "is-warn", true); return; }
      const age = Number(st.last_seen_ms);
      const alive = !!st.online && (!("last_seen_ms" in st) || age < 3000);
      const pub = S.hostManifest && S.hostManifest.version;
      const ver = st.status_seen ? (st.host_version || "sem versão") : "—";
      const devs = Array.isArray(st.devices) ? st.devices : [];
      const estado = S.host.inRom ? "em modo de gravação" : alive ? "respondendo" : (st.status_seen ? "sem resposta agora" : "nunca respondeu");
      g.innerHTML = [
        hostDlgRow("Estado", estado, alive ? "is-ok" : "is-warn"),
        hostDlgRow("Versão", ver + (pub ? ` · publicada ${pub}` : ""), pub && st.status_seen && hostNeedsUpdate(st.host_version, pub) ? "is-new" : (st.status_seen ? "is-ok" : "")),
        hostDlgRow("Modo", st.mode_label || "—"),
        hostDlgRow("Último quadro", Number.isFinite(age) && st.status_seen ? (age < 1000 ? "agora" : Math.round(age / 1000) + " s atrás") : "—"),
        hostDlgRow("Conexão", st.status_text || "—", "", true),
        hostDlgRow("Aparelhos USB", devs.length ? devs.map((d) => `${d.product || d.kind || "?"}${d.port != null ? " · porta " + d.port : ""}${d.ready === false ? " (não pronto)" : ""}`).join(", ") : (st.devices_reported ? "nenhum" : "—"), "", true),
        hostDlgRow("Bluetooth", st.ble_enabled ? (st.ble_connected ? "ligado · conectado" : "ligado") : "desligado"),
        hostDlgRow("Filtro MIDI", st.midi_filter_channel ? "canal " + st.midi_filter_channel : "todos os canais"),
        hostDlgRow("Último ACK", (st.last_ack === 255 || st.last_ack == null) ? "—" : String(st.last_ack)),
        hostDlgRow("Reinício por comando", st.restart || "—"),
      ].join("");
    }
    async function hostDlgRefresh(fresh) {
      if (!S.ctl) { renderHostDlg(null); return; }
      const st = await hostStatus(fresh !== false);
      if (st) hostDlgLast = st;
      renderHostDlg(st);
    }
    function hostDlgTools(disabled) {
      const pub = S.hostManifest && S.hostManifest.version;
      const tools = [
        ["refresh", "Atualizar status", "refresh"],
        ["restart", "Reiniciar o USB Host", "bolt"],
        pub ? ["reflash", `Regravar o firmware ${pub}`, "download"] : null,
        ["dlmode", "Colocar em modo de gravação", "usb"],
        pub ? ["recover", "Gravar host já em modo de gravação", "usb"] : null,
        ["copy", "Copiar status", "spark"],
      ].filter(Boolean);
      $("hostDlgTools").innerHTML = tools.map(([id, label, icon]) => `<button type="button" class="btn is-ghost" data-tool="${id}" ${disabled ? "disabled" : ""}>${svgIcon[icon]}<span>${esc(label)}</span></button>`).join("");
    }
    function openHostDialog() {
      if (!S.ctl || !S.host.has || S.busy) return;
      hostDlgMsg("");
      hostDlgTools(false);
      renderHostDlg(hostDlgLast);
      if (!hostDlg.open) hostDlg.showModal();
      hostDlgRefresh(true);
      clearInterval(hostDlgTimer);
      hostDlgTimer = setInterval(() => { if (!hostDlgBusy && hostDlg.open && S.mode === "ready") hostDlgRefresh(true); }, 3000);
    }
    function closeHostDialog() { clearInterval(hostDlgTimer); hostDlgTimer = null; if (hostDlg.open) hostDlg.close(); }
    hostDlg.addEventListener("close", () => { clearInterval(hostDlgTimer); hostDlgTimer = null; });
    hostDlg.addEventListener("cancel", (e) => { if (hostDlgBusy) e.preventDefault(); });
    $("hostDlgClose").addEventListener("click", () => { if (!hostDlgBusy) closeHostDialog(); });
    $("hostDlgTools").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-tool]");
      if (!btn || hostDlgBusy) return;
      const id = btn.dataset.tool;
      if (id === "refresh") { hostDlgMsg("Pedindo um status novo…"); await hostDlgRefresh(true); hostDlgMsg(""); return; }
      if (id === "copy") {
        try { await navigator.clipboard.writeText(JSON.stringify(hostDlgLast || {}, null, 2)); hostDlgMsg("Status copiado.", "is-ok"); }
        catch { hostDlgMsg("Não deu pra copiar.", "is-warn"); }
        return;
      }
      if (id === "reflash") { closeHostDialog(); startHostOnly(); return; }
      if (id === "recover") { closeHostDialog(); startHostRecover(); return; }
      hostDlgBusy = true; S.busy = true; hostDlgTools(true);
      try {
        if (id === "restart") await toolRestartHost();
        else if (id === "dlmode") await toolHostDownloadMode();
      } catch (err) {
        hostDlgMsg(esc(err.message), "is-warn");
        log("ferramenta do host: " + err.message);
      } finally { hostDlgBusy = false; S.busy = false; hostDlgTools(false); }
    });
    // Reinício por comando: a controladora publica o andamento no campo
    // `restart` do status (sent → ok → done | fail), lido do CACHE — um pedido
    // novo atendido entre o ACK e a queda seria confundido com o boot novo.
    // `msg` = onde escrever o andamento: o painel USB HOST (padrão) ou o
    // painel FERRAMENTAS, que chama as mesmas duas.
    async function toolRestartHost(msg = hostDlgMsg) {
      msg("Mandando o comando de reinício…");
      try { await S.ctl.call("POST", "/usb_host/restart", "", 6000); }
      catch (e) { if (/USB 404/.test(String(e.message))) throw new Error("Esta controladora não tem o comando de reinício (firmware anterior)."); throw e; }
      let st = null;
      const ackDeadline = Date.now() + 5000;
      while (Date.now() < ackDeadline) { await sleep(300); st = await hostStatus(false); if (st && st.restart && st.restart !== "sent") break; }
      if (!st || !st.restart || st.restart === "sent" || st.restart === "fail") throw new Error("O USB Host não confirmou o reinício (host anterior ao 3.1, ou mudo).");
      msg("Confirmou. Esperando voltar…");
      const bootDeadline = Date.now() + 15000;
      while (st.restart !== "done" && Date.now() < bootDeadline) { await sleep(500); st = (await hostStatus(false)) || st; }
      if (st.restart !== "done") throw new Error("O USB Host reiniciou, mas não voltou a responder no prazo.");
      hostDlgLast = st; renderHostDlg(st);
      msg("USB Host reiniciado e respondendo.", "is-ok");
    }
    async function toolHostDownloadMode(msg = hostDlgMsg) {
      if (!window.confirm("Colocar o USB Host em modo de gravação?\n\nEle para de responder (os aparelhos USB param) até ser gravado pelo cabo na porta HOST ou até a controladora ser desligada e ligada.")) return;
      msg("Mandando o comando…");
      S.host.before = await hostConnectedPorts();
      const r = await enterHostRomForCable();
      if (!r.ok) throw new Error(r.reason === "stillAnswering" ? "O USB Host continua respondendo: não entrou em modo de gravação." : "O USB Host recusou o comando.");
      S.host.inRom = true;
      log("modo de gravação do host pela ferramenta: " + r.via);
      await hostDlgRefresh(false);
      msg("Em modo de gravação. Ligue o cabo na porta HOST e use <b>Gravar host já em modo de gravação</b> (ou a gravação direta, nas Ferramentas).", "is-ok");
    }
    // Host já no ROM (ferramenta acima, ou gravação que parou no meio): o
    // passo HOST sem o comando, aceitando a porta autorizada.
    async function startHostRecover() {
      if (S.busy || !S.hostManifest) return;
      S.busy = true; S.hostFailed = false; S.host.direct = false;
      S.plan = { ctrl: false, host: true };
      setRail(["connect", "identify", "host", "done"]);
      await hostStage({ recovering: true });
      if (S.hostFailed) return;
      S.busy = false;
      screenDone();
    }

    // ══════════════════════════════════════════════════════════════════
    // FERRAMENTAS (botão no topo) — atualização direta do USB Host, reset e
    // recuperação da controladora e do host, diagnóstico de porta.
    // ══════════════════════════════════════════════════════════════════
    // Pedido do dono (26/out/2026). Cada ferramenta reusa um pedaço do fluxo
    // principal: o mesmo canal CDC, a mesma cascata de reset, o mesmo esptool
    // e as mesmas provas de "porta certa" (flash de 4 × 16 MB). O que não pode
    // rodar fica à vista, inerte, com o motivo — nunca some. Ferramenta que
    // precisa da janela de portas chama requestPort como PRIMEIRO await do
    // clique (ativação do usuário).
    const ROM_FILTERS = BOOTLOADER_PIDS.map((pid) => ({ usbVendorId: 0x303a, usbProductId: pid }));
    const HOST_PORT_FILTERS = [...HOST_ROM_PIDS, HOST_UPDATE_PID].map((pid) => ({ usbVendorId: 0x303a, usbProductId: pid }));
    const KIND_LABEL = { "ctrl-s2": "controladora BFMiDi (ESP32-S2, 4 MB)", "ctrl-s3": "controladora BFMiDi S3 (ESP32-S3, 16 MB)", host: "USB Host (ESP32-S3, 4 MB)", unknown: "chip não reconhecido" };

    // Conecta o esptool numa porta de bootloader SEM gravar e diz quem está do
    // outro lado: chip, MAC, flash — e por eles, controladora S2/S3 ou USB
    // Host. Na porta USB-JTAG (1001) o default_reset leva o chip ao ROM mesmo
    // sem firmware (host em loop, modo computador); na OTG (0009/0002), no_reset.
    async function probeRomPort(port) {
      const info = portInfo(port);
      const mode = info.usbProductId === 0x1001 ? "default_reset" : "no_reset";
      let transport = null, loader = null, lastErr = null;
      for (let a = 1; a <= 3 && !loader; a++) {
        try {
          transport = fixReadLoop(wrapSignals(new Transport(port, true)));
          const l = new ESPLoader({ transport, baudrate: 115200, romBaudrate: 115200, terminal: espLoaderTerminal });
          await l.main(mode);
          loader = l;
        } catch (e) {
          lastErr = e;
          await closeTransportSafe(transport); transport = null;
          log(`sonda: tentativa ${a} falhou: ${e.message}`);
          if (a < 3) await sleep(800 * a);
        }
      }
      if (!loader) throw new Error("o chip não respondeu em modo de gravação (" + (lastErr && lastErr.message) + ")");
      let chipName = "", desc = "", mac = "";
      try { chipName = String(loader.chip?.CHIP_NAME || ""); } catch { }
      try { desc = String(await loader.chip.getChipDescription(loader)); } catch { }
      try { if (loader.chip && typeof loader.chip.readMac === "function") mac = String(await loader.chip.readMac(loader)); } catch { }
      const kb = await readFlashSizeKb(loader);
      const all = chipName + " " + desc;
      const chip = /S3/.test(all) ? "s3" : /S2/.test(all) ? "s2" : "";
      const kind = chip === "s2" ? (!kb || kb === 4096 ? "ctrl-s2" : "unknown") : chip === "s3" ? (kb === 16384 ? "ctrl-s3" : kb === 4096 ? "host" : "unknown") : "unknown";
      log(`sonda: ${desc || chipName || "?"} · flash ${kb ? kb / 1024 + " MB" : "?"} · ${KIND_LABEL[kind]}`);
      return { loader, transport, chipName, desc, mac, kb, chip, kind, pid: info.usbProductId };
    }
    // Reinicia o chip de uma porta de bootloader SEM gravar (S3 pelo watchdog
    // do RTC, como no fim da gravação; S2 pelo after + hardReset). `expect`
    // recusa a porta errada antes de encostar: "ctrl" ou "host".
    async function resetChipOnPort(port, expect, msg) {
      const r = await probeRomPort(port);
      try {
        if (expect === "ctrl" && r.kind === "host") { const e = new Error("esta porta é o USB Host (ESP32-S3 de 4 MB), não a controladora"); e.wrongDevice = true; throw e; }
        if (expect === "host" && r.kind !== "host") { const e = new Error("esta porta é a " + KIND_LABEL[r.kind] + ", não o USB Host"); e.wrongDevice = true; throw e; }
        if (msg) msg(`${esc(KIND_LABEL[r.kind])} — reiniciando o chip…`);
        if (r.chip === "s3") {
          try { await resetS3ByWatchdog(r.loader); }
          catch (e) { log("watchdog falhou (" + e.message + ") — reset padrão."); try { await r.loader.after("hard_reset", r.pid === 0x0009); } catch { } }
        } else {
          try { await r.loader.after(); } catch (e) { log("after(): " + e.message); }
          try { await r.loader.hardReset(); } catch { }
        }
      } finally { await closeTransportSafe(r.transport); }
      r.rebooted = await portWentAway(port, 6000);
      log("reset do chip enviado" + (r.rebooted ? " — a porta sumiu (reiniciou)." : " — a porta continua de pé."));
      return r;
    }
    // Reinicia a controladora em modo de gravação (a cascata do passo 3, pela
    // porta que o canal de controle abriu). Devolve a porta do ROM, ou null
    // quando o navegador ainda não a autorizou (o S2 troca de PID).
    async function enterRomFromApp(msg) {
      const port = S.device;
      if (msg) msg("Reiniciando a controladora em modo de gravação…");
      try { S.beforePorts = (await serialLib().getPorts()).filter((p) => p !== port && p.connected === true); } catch { S.beforePorts = []; }
      let resetOk = false;
      if (S.ctl) { try { resetOk = await S.ctl.resetToBootloader(); } catch (e) { log("resetToBootloader: " + e.message); } S.ctl = null; }
      closeHostDialog();
      if (!resetOk) {
        log("Reset pelo canal de controle não pegou — tentando pelo esptool.");
        let pre = null;
        try { pre = wrapSignals(new Transport(port, true)); await pre.connect(115200); await pulseBootMode(pre); }
        catch (e) { log("Boot pulse warning: " + e.message); }
        finally { await closeTransportSafe(pre); }
      }
      await sleep(2000);
      const rom = await waitForReconnect(3000);
      if (rom) return rom;
      // Porta nova sem autorização: a página volta ao passo 1 (a porta do app
      // morreu) e o painel pede a porta; "Procurar a controladora" também serve.
      S.device = null; S.lastPortInfo = null; S.info = null; S.retryFromRom = false;
      screenConnect("A controladora está em modo de gravação numa porta nova. Autorize-a nas Ferramentas, ou clique em Procurar a controladora e escolha a linha do bootloader.");
      return null;
    }
    async function identifyPort(port) {
      await closeCtl(); closeHostDialog();
      S.manualDisconnect = false; S.retryFromRom = false;
      setDevice(port);
      await identify();
    }
    async function pickPortAndIdentify(filters) {
      const port = await requestPort(filters);
      if (!port || S.busy) return;
      S.busy = true;
      try { await identifyPort(port); }
      catch (err) { log("Falha ao identificar: " + err.message); screenError(err); }
      finally { S.busy = false; }
    }
    async function waitAppAndIdentify(msg) {
      if (msg) msg("Esperando a controladora ligar…");
      const app = await AB.waitForAppPort(0x303a, 25000, S.beforePorts);
      if (!app) {
        S.device = null; S.lastPortInfo = null; S.info = null;
        screenConnect("O chip reiniciou, mas não apareceu como BFMiDi: pode estar sem firmware. Use a gravação.");
        throw new Error("a controladora não voltou como BFMiDi (PID 80C2) — sem firmware? Grave-a de novo.");
      }
      await sleep(1500);
      await identifyPort(app);
    }

    // ── as ferramentas ──
    async function toolBackupNow(msg) {
      msg("Lendo os dados da controladora…");
      const { obj, stats } = await AB.extractBackup(S.ctl, { log, onProgress: (p) => {
        const pct = typeof p.pct === "number" ? ` ${p.pct}%` : "";
        const kb = p.bytes ? ` (${(p.bytes / 1024).toFixed(0)} KB)` : "";
        msg(`Guardando ${backupPhaseLabel(p)}${pct}${kb}…`);
      } });
      AB.downloadBackup(obj);
      log(`Backup pelas Ferramentas: ${stats.presets} presets, ${stats.images} imagens, ${stats.icons} ícones, ${stats.userPedals} aparelhos.`);
      msg(`Backup baixado: ${stats.presets} presets, ${stats.images} imagens, ${stats.icons} ícones e ${stats.userPedals} aparelhos personalizados.`, "is-ok");
    }
    // O arquivo vem de uma <input type=file> criada na hora (precisa do clique
    // do usuário); a devolução roda depois, dentro de um runTool próprio.
    async function toolRestorePick(msg) {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.addEventListener("change", async () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        let obj = null;
        try { obj = JSON.parse(await f.text()); } catch { toolsMsg("Arquivo inválido: não é um JSON.", "is-warn"); return; }
        if (!obj || typeof obj !== "object" || !obj.presets || typeof obj.presets !== "object") { toolsMsg("Isto não é um backup da BFMiDi (sem presets).", "is-warn"); return; }
        if (!(S.ctl && S.mode === "ready")) { toolsMsg("A controladora não está mais respondendo pelo cabo.", "is-warn"); return; }
        const n = Object.keys(obj.presets).length;
        const board = String(obj.board || (obj.global_config && obj.global_config.board) || "");
        const mine = (S.info && S.info.board) || "";
        let q = `Restaurar ${n} preset(s)${obj.images ? ", imagens" : ""}${obj.icons ? ", ícones" : ""} de "${f.name}" nesta controladora?\n\nOs presets atuais são substituídos e a controladora reinicia no fim.`;
        if (board && mine && canonicalBoard(board) !== canonicalBoard(mine)) q += `\n\nATENÇÃO: o backup é de uma ${board}; esta é uma ${mine}.`;
        if (!window.confirm(q)) return;
        runTool("restore", (m) => toolRestoreRun(obj, m));
      });
      inp.click();
      msg("Escolha o arquivo de backup (bfmidi-backup-*.json).");
    }
    async function toolRestoreRun(obj, msg) {
      // espelha só a mídia que o arquivo TEM (sem a chave pode ser um backup antigo, sem mídia)
      const prune = [];
      if (obj.images && typeof obj.images === "object") prune.push("img");
      if (obj.icons && typeof obj.icons === "object") prune.push("icon");
      msg("Devolvendo os dados…");
      const stats = await AB.injectBackup(S.ctl, obj, { log, prune, onProgress: (p) => msg(`Gravando ${backupPhaseLabel(p)}${typeof p.pct === "number" ? " " + p.pct + "%" : ""}…`) });
      log(`Restaurado pelas Ferramentas: ${stats.presets} presets, ${stats.images} imagens, ${stats.icons} ícones, ${stats.userPedals} aparelhos` + (stats.failed.length ? ` — falhou: ${stats.failed.join(", ")}` : "") + ".");
      // o /restore agenda o reinício: espera a porta cair e voltar, e identifica de novo
      const old = S.device;
      await closeCtl();
      msg("Restaurado. A controladora está reiniciando…");
      if (old) await portWentAway(old, 8000);
      S.device = null;
      await waitAppAndIdentify(msg);
      msg(`Restaurados ${stats.presets} presets, ${stats.images} imagens e ${stats.icons} ícones.` + (stats.failed.length ? ` Não coube: ${esc(stats.failed.join(", "))}.` : ""), stats.failed.length ? "is-warn" : "is-ok");
    }
    async function toolCtrlRestart(msg) {
      const rom = await enterRomFromApp(msg);
      if (!rom) { showPending({ id: "restart", filters: ROM_FILTERS, text: "A controladora reiniciou em modo de gravação numa porta nova. Autorize-a (a linha do bootloader) pra concluir o reinício.", label: "Autorizar a porta e concluir", run: finishRestart }); return; }
      await finishRestart(rom, msg);
    }
    async function finishRestart(port, msg) {
      if (!BOOTLOADER_PIDS.includes(portInfo(port).usbProductId)) { await identifyPort(port); msg("A controladora já está rodando o firmware.", "is-ok"); return; }
      await resetChipOnPort(port, "ctrl", msg);
      await waitAppAndIdentify(msg);
      msg(`Controladora reiniciada: ${esc((S.info && S.info.board) || "BFMiDi")} · firmware ${esc((S.info && S.info.fw) || "?")}.`, "is-ok");
    }
    async function toolCtrlToRom(msg) {
      const rom = await enterRomFromApp(msg);
      if (!rom) { showPending({ id: "torom", filters: ROM_FILTERS, text: "A controladora está em modo de gravação numa porta nova. Autorize-a (a linha do bootloader) pra página reconhecê-la.", label: "Autorizar a porta", run: finishToRom }); return; }
      await finishToRom(rom, msg);
    }
    async function finishToRom(port, msg) {
      await identifyPort(port);
      const inRom = !!(S.info && S.info.bootloader);
      msg(inRom ? "Controladora em modo de gravação. A página já oferece a gravação; pra voltar sem gravar, use <b>Sair do modo de gravação</b>." : "A porta escolhida é a do firmware rodando — a controladora não ficou em modo de gravação.", inRom ? "is-ok" : "is-warn");
    }
    async function toolExitRom(msg) {
      const r = await resetChipOnPort(S.device, "ctrl", msg);
      if (!r.rebooted) log("a porta do ROM continua de pé depois do reset");
      await waitAppAndIdentify(msg);
      msg(`Controladora de volta: ${esc((S.info && S.info.board) || "BFMiDi")} · firmware ${esc((S.info && S.info.fw) || "?")}.`, "is-ok");
    }
    async function toolIdentChip(msg) {
      const port = await requestPort(ROM_FILTERS);
      if (!port) return;
      msg("Conectando ao chip…");
      const r = await probeRomPort(port);
      await closeTransportSafe(r.transport);
      const pidTxt = r.pid === 0x1001 ? "USB-Serial-JTAG" : r.pid === 0x0002 ? "ROM do ESP32-S2" : "ROM USB-OTG";
      const lines = [`<b>${esc(KIND_LABEL[r.kind])}</b>`, `Chip: ${esc(r.desc || r.chipName || "?")}`, r.mac ? `MAC: ${esc(r.mac)}` : "", `Flash: ${r.kb ? r.kb / 1024 + " MB" : "não lida"}`,
        `Porta: PID 0x${r.pid.toString(16)} (${pidTxt})`, `<i>O chip continua em modo de gravação.</i>`];
      msg(lines.filter(Boolean).join("<br>"), r.kind === "unknown" ? "is-warn" : "is-ok");
    }
    async function toolHostChipReset(msg) {
      let port = await requestPort(HOST_PORT_FILTERS);
      if (!port) return;
      if (hostPortKind(port) === "update") {
        msg("Host antigo em modo update: mandando BOOT…");
        port = await bootHostFromUpdateMode(port);
        if (!port) throw new Error("o bootloader apareceu como outra porta: autorize-a e tente de novo");
      }
      const r = await resetChipOnPort(port, "host", msg);
      if (r.rebooted) { S.host.inRom = false; msg("USB Host reiniciado: a porta sumiu do computador, ele voltou ao firmware.", "is-ok"); }
      else msg("Reset enviado, mas a porta continua de pé — o módulo pode estar sem firmware. Use a gravação direta pela porta HOST.", "is-warn");
    }
    // O host SEM comando pela controladora: já em modo de gravação, em modo
    // computador (3.7) ou com o firmware pela metade — inclusive sem a
    // controladora no cabo DEVICE (ela só precisa estar LIGADA: alimenta o
    // módulo). Com o canal CDC aberto, a versão ainda é conferida por ela.
    async function startHostDirect() {
      if (S.busy || !S.hostManifest) return;
      S.busy = true; S.hostFailed = false;
      S.host.direct = true;
      S.plan = { ctrl: false, host: true };
      setRail(S.info ? ["connect", "identify", "host", "done"] : ["host", "done"]);
      await hostStage({ recovering: true });
      if (S.hostFailed) return;
      S.busy = false;
      screenDone();
    }

    // ── a tela ──
    let toolsBusy = false, toolsPending = null;   // pending = { id, filters, text, label, run(port, msg) }
    let toolsTab = "host";                         // seção aberta na barra de cima
    // A ORDEM é a da barra: VOLTAR · HOST · CONTROLADORA · DIAGNÓSTICOS (pedido do dono).
    const TOOL_SECTIONS = [
      { id: "host", label: "HOST", title: "USB Host", sub: "PORTA HOST", icon: "usb",
        desc: "Atualize o módulo pelo cabo na porta HOST, reinicie-o ou recupere um host parado no bootloader." },
      { id: "ctrl", label: "CONTROLADORA", title: "Controladora", sub: "CABO DEVICE", icon: "device",
        desc: "Regrave, reinicie, faça ou devolva um backup e recupere uma controladora parada no bootloader." },
      { id: "diag", label: "DIAGNÓSTICOS", title: "Diagnósticos", sub: "PORTAS E REGISTRO", icon: "stetho",
        desc: "Descubra o que está em cada porta do computador e guarde o registro pro suporte." },
    ];
    const WHY = {
      ctrl: "Identifique a controladora primeiro (passos 1 e 2).",
      ctl: "Só com a controladora respondendo pelo cabo DEVICE.",
      host: "Só nas placas com USB Host, com a controladora e o host respondendo.",
      rom: "Só com a controladora identificada em modo de gravação.",
      manifest: "Sem a lista de versões publicada (sem internet?).",
      busy: "Aguarde a operação em curso.",
      serial: "Precisa do Chrome ou do Edge no computador.",
      none: "Nenhum backup guardado nesta sessão.",
    };
    function toolCtx() {
      const info = S.info || {};
      const free = !S.busy && !toolsBusy;
      const ready = free && S.mode === "ready" && !!S.info;
      const ctl = ready && !!S.ctl && !info.bootloader && !info.unidentified;
      return { free, ready, ctl, info, inRom: ready && !!info.bootloader, host: ctl && S.host.has, hostUp: ctl && S.host.has && S.host.seen && !S.host.inRom,
        man: !!S.manifest, hman: !!S.hostManifest, serial: !!serialLib(), latest: latestFor(info.chip || S.chipKey), hostWant: (S.hostManifest && S.hostManifest.version) || "" };
    }
    // Cada ferramenta: seção, título, frase, `need(c)` = "" quando pode rodar ou
    // a chave do motivo, e `run`. `leave` = fecha o painel e toma a página (os
    // fluxos principais cuidam do S.busy); sem ele roda aqui dentro, pelo
    // runTool. `pick` = o clique abre a janela de portas. `confirm` = pergunta antes.
    const TOOLS = [
      { sec: "ctrl", id: "reflash", icon: "refresh", label: "Regravar", title: "Regravar o firmware publicado", hint: (c) => `Grava de novo a ${c.latest || "versão publicada"} e devolve seus dados (backup automático).`,
        need: (c) => !c.free ? "busy" : !c.ready ? "ctrl" : !c.man ? "manifest" : "", leave: true, run: () => startUpdate({ hostToo: false }) },
      { sec: "ctrl", id: "erase", icon: "warn", danger: true, label: "Apagar e regravar", title: "Apagar toda a memória e regravar", hint: () => "Restauração de fábrica: apaga também modelo, cores, brilho e Wi‑Fi antes de gravar. Confira o MODELO no editor depois.",
        need: (c) => !c.free ? "busy" : !c.ready ? "ctrl" : !c.man ? "manifest" : "", leave: true,
        confirm: (c) => `APAGAR TODA A MEMÓRIA da controladora e gravar a ${c.latest || "versão publicada"}?\n\nSome tudo: presets, imagens, ícones, modelo da placa, cores, brilho e Wi‑Fi.${S.wantBackup && c.ctl ? " Com o backup automático ligado, presets e mídia voltam no fim;" : ""} a configuração global volta ao padrão de fábrica — confira o MODELO no editor depois (numa NANO+ ou MICRO o modelo errado deixa o display apagado).\n\nContinuar?`,
        run: () => { S.eraseOnce = true; log("Ferramentas: apagar toda a memória antes desta gravação."); startUpdate({ hostToo: false }); } },
      { sec: "ctrl", id: "backup", icon: "download", label: "Fazer backup", title: "Fazer backup agora", hint: () => "Lê presets, imagens, ícones e aparelhos personalizados e baixa o arquivo (restaurável aqui ou no editor).",
        need: (c) => !c.free ? "busy" : !c.ctl ? "ctl" : "", run: toolBackupNow },
      { sec: "ctrl", id: "restore", icon: "upload", label: "Escolher o arquivo", title: "Restaurar um arquivo de backup", hint: () => "Devolve à controladora um bfmidi-backup-*.json. Os presets atuais são substituídos e ela reinicia no fim.",
        need: (c) => !c.free ? "busy" : !c.ctl ? "ctl" : "", run: toolRestorePick },
      { sec: "ctrl", id: "restart", icon: "bolt", label: "Reiniciar", title: "Reiniciar a controladora", hint: () => "Reinicia pelo modo de gravação e volta ao firmware, sem gravar nada (≈ 15 s). Na BFMiDi 1, 2 e 3 o navegador pode pedir a porta nova.",
        need: (c) => !c.free ? "busy" : !c.ctl ? "ctl" : "", run: toolCtrlRestart },
      { sec: "ctrl", id: "torom", icon: "chip", label: "Entrar", title: "Colocar em modo de gravação", hint: () => "Deixa a controladora no bootloader (tela apagada) pra gravar por esta página ou por outra ferramenta.",
        need: (c) => !c.free ? "busy" : !c.ctl ? "ctl" : "", run: toolCtrlToRom },
      { sec: "ctrl", id: "exitrom", icon: "refresh", label: "Sair", title: "Sair do modo de gravação", hint: () => "Controladora parada no bootloader: reinicia o chip sem gravar nada e volta ao firmware que está nela.",
        need: (c) => !c.free ? "busy" : !c.inRom ? "rom" : "", run: toolExitRom },
      { sec: "ctrl", id: "pickrom", icon: "usb", label: "Escolher a porta", pick: true, title: "Gravar uma controladora já em modo de gravação", hint: () => "Escolha a porta do bootloader na janela do navegador: a página identifica o chip e oferece a gravação.",
        need: (c) => !c.free ? "busy" : !c.serial ? "serial" : "", leave: true, run: () => pickPortAndIdentify(ROM_FILTERS) },

      { sec: "host", id: "hostupd", icon: "upload", label: "Atualizar", title: "Atualizar o USB Host pela controladora", hint: (c) => `A controladora manda o módulo pro modo de gravação; o firmware ${c.hostWant || "publicado"} entra por um segundo cabo na porta HOST.`,
        need: (c) => !c.free ? "busy" : !c.hostUp ? "host" : !c.hman ? "manifest" : "", leave: true, run: () => startHostOnly() },
      { sec: "host", id: "hostdirect", icon: "bolt", label: "Gravar direto", title: "Gravar o USB Host direto pela porta HOST", hint: (c) => `Sem comando pela controladora: módulo já em modo de gravação, em modo computador ou com o firmware pela metade. A controladora precisa estar ligada (fonte 9 V ou cabo DEVICE). Grava a ${c.hostWant || "versão publicada"}.`,
        need: (c) => !c.free ? "busy" : !c.serial ? "serial" : !c.hman ? "manifest" : "", leave: true, run: () => startHostDirect() },
      { sec: "host", id: "hostrestart", icon: "refresh", label: "Reiniciar", title: "Reiniciar o USB Host", hint: () => "Comando pela controladora (host 3.1 ou mais novo). Os aparelhos USB caem e voltam.",
        need: (c) => !c.free ? "busy" : !c.hostUp ? "host" : "", run: (msg) => toolRestartHost(msg) },
      { sec: "host", id: "hostrom", icon: "chip", label: "Entrar", title: "Colocar o USB Host em modo de gravação", hint: () => "O módulo para de responder até ser gravado pelo cabo na porta HOST ou até a controladora ser desligada e ligada.",
        need: (c) => !c.free ? "busy" : !c.hostUp ? "host" : "", run: (msg) => toolHostDownloadMode(msg) },
      { sec: "host", id: "hostreset", icon: "bolt", label: "Escolher a porta", pick: true, title: "Reiniciar o chip pela porta HOST", hint: () => "Host parado no bootloader (porta ESP32-S3 no computador): reinicia sem gravar. Sem firmware nele, só a gravação resolve.",
        need: (c) => !c.free ? "busy" : !c.serial ? "serial" : "", run: toolHostChipReset },
      { sec: "host", id: "hoststatus", icon: "spark", label: "Abrir", title: "Status e ferramentas do USB Host", hint: () => "Estado, versão, aparelhos USB, Bluetooth e filtro MIDI, lidos pela controladora.",
        need: (c) => !c.free ? "busy" : !c.host ? "host" : "", inline: true, run: () => openHostDialog() },

      { sec: "diag", id: "ident", icon: "chip", label: "Escolher a porta", pick: true, title: "Identificar o chip de uma porta em modo de gravação", hint: () => "Diz se a porta é a controladora (S2 ou S3) ou o USB Host, com MAC e tamanho da flash. Não grava nada.",
        need: (c) => !c.free ? "busy" : !c.serial ? "serial" : "", run: toolIdentChip },
      { sec: "diag", id: "dlbackup", icon: "download", label: "Baixar", title: "Baixar o backup guardado no navegador", hint: () => "O último backup desta sessão ou de uma anterior. Nunca é devolvido sozinho: pode ser de outra controladora.",
        need: () => (S.pendingBackup || S.recoveredBackup) ? "" : "none", run: async (msg) => { AB.downloadBackup(S.pendingBackup || S.recoveredBackup); msg("Backup baixado.", "is-ok"); } },
      { sec: "diag", id: "copylog", icon: "spark", label: "Copiar", title: "Copiar o registro técnico", hint: () => "Tudo o que a página fez nesta sessão, pra mandar ao suporte.",
        need: () => "", run: async (msg) => { await navigator.clipboard.writeText(logLines.join("\n")); msg("Registro copiado.", "is-ok"); } },
    ];
    function toolsMsg(html, cls) { const m = $("toolsMsg"); m.className = "tmsg " + (cls || ""); m.innerHTML = html || ""; }
    function showPending(pend) {
      toolsPending = pend;
      toolsMsg(`${esc(pend.text)}<br><button type="button" class="btn is-primary" data-pend>${svgIcon.usb}<span>${esc(pend.label)}</span></button>`, "is-warn");
    }
    function ctrlStateLabel(c) {
      if (!c.ready) return S.busy && !toolsBusy ? "ocupada" : "não identificada";
      if (c.inRom) return "em modo de gravação";
      if (c.info.unidentified) return "sem resposta";
      return `${prettyBoard(c.info.board).variant} · fw ${c.info.fw || "antigo"}`;
    }
    function hostStateLabel(c) {
      if (!c.ready || !c.info.board) return "";
      if (!S.host.has) return "esta placa não tem";
      if (S.host.inRom) return "em modo de gravação";
      if (!S.host.seen) return "sem resposta";
      return (S.host.version || "sem versão") + (c.hostWant ? ` · publicado ${c.hostWant}` : "");
    }
    // A TELA: o assistente some (data-view="tools" no <html>) e no lugar entram
    // a barra de ícones grandes e a seção escolhida. VOLTAR devolve o assistente
    // exatamente como estava — nada dele é desmontado, e as ferramentas que
    // mexem nele (identificar de novo, modo de gravação) o atualizam por trás.
    const toolsView = $("toolsView");
    const toolsOpen = () => root.getAttribute("data-view") === "tools";
    function renderTools() {
      const c = toolCtx();
      const sec = TOOL_SECTIONS.find((s) => s.id === toolsTab) || TOOL_SECTIONS[0];
      $("toolsNav").innerHTML = [`<button type="button" class="tnav-b is-back" data-nav="back" ${toolsBusy ? "disabled" : ""}>${svgIcon.back}<span>VOLTAR</span></button>`]
        .concat(TOOL_SECTIONS.map((s) => `<button type="button" class="tnav-b is-${s.id}${s.id === sec.id ? " is-on" : ""}" data-nav="${s.id}" aria-current="${s.id === sec.id ? "page" : "false"}">${svgIcon[s.icon]}<span>${esc(s.label)}</span></button>`)).join("");
      const st = sec.id === "ctrl" ? ctrlStateLabel(c) : sec.id === "host" ? hostStateLabel(c) : "";
      $("toolsHead").innerHTML = `<div class="thead-ic is-${sec.id}">${svgIcon[sec.icon]}</div>
        <div class="thead-t"><div class="eyebrow">${esc(sec.sub)}</div><h1>${esc(sec.title)}</h1><p>${esc(sec.desc)}</p></div>
        ${st ? `<div class="thead-st"><span>ESTADO</span><b>${esc(st)}</b></div>` : ""}`;
      $("toolsBody").innerHTML = TOOLS.filter((t) => t.sec === sec.id).map((t) => {
        const why = t.need(c);
        const off = !!why || toolsBusy;
        return `<div class="trow is-${sec.id}${t.danger ? " is-danger" : ""}${off ? " is-off" : ""}">
          <div class="ti">${svgIcon[t.icon]}</div>
          <div class="tt"><b>${esc(t.title)}</b><span>${esc(t.hint(c))}</span>${why && why !== "busy" ? `<span class="why">${esc(WHY[why])}</span>` : ""}</div>
          <button type="button" class="btn is-ghost${t.danger ? " is-dgr" : ""}" data-tool="${t.id}" ${off ? "disabled" : ""}>${svgIcon[t.pick ? "usb" : "arrow"]}<span>${esc(t.label)}</span></button>
        </div>`;
      }).join("");
    }
    function openToolsView(tab) {
      if (tab) toolsTab = tab;
      renderTools();
      if (!toolsPending) toolsMsg(S.busy && !toolsBusy ? WHY.busy : "");
      root.setAttribute("data-view", "tools");
      toolsView.hidden = false;
      els.pillTools.classList.add("is-on");
      window.scrollTo(0, 0);
    }
    function closeToolsView() {
      if (!toolsOpen()) return;
      root.removeAttribute("data-view");
      toolsView.hidden = true;
      els.pillTools.classList.remove("is-on");
    }
    els.pillTools.addEventListener("click", () => { if (toolsOpen()) { if (!toolsBusy) closeToolsView(); } else openToolsView(); });
    $("toolsNav").addEventListener("click", (e) => {
      const b = e.target.closest("[data-nav]");
      if (!b) return;
      if (b.dataset.nav === "back") { if (!toolsBusy) closeToolsView(); return; }
      toolsTab = b.dataset.nav;
      renderTools();
      if (!toolsBusy && !toolsPending) toolsMsg("");
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && toolsOpen() && !toolsBusy && !document.querySelector("dialog[open]")) closeToolsView();
    });
    async function runTool(id, fn, pend) {
      if (toolsBusy) return;
      toolsBusy = true; S.busy = true; toolsPending = null;
      renderTools(); toolsMsg("Um momento…");
      try { await fn(toolsMsg); }
      catch (err) {
        log("ferramenta " + id + ": " + (err && err.message)); if (err && err.stack) log(err.stack);
        if (pend && err && err.wrongDevice) showPending(Object.assign({}, pend, { text: err.message + ". Escolha a outra linha." }));
        else toolsMsg(esc((err && err.message) || String(err)), "is-warn");
      } finally {
        toolsBusy = false; S.busy = false;
        // o cabo saiu no meio (o handler de disconnect ficou de fora enquanto a ferramenta rodava)
        if (!toolsPending && S.mode === "ready" && S.device && S.device.connected === false) {
          await closeCtl(); S.device = null; S.lastPortInfo = null; S.info = null;
          screenConnect("A controladora foi desconectada. Ligue o cabo de novo pra continuar.");
        }
        renderTools();
      }
    }
    $("toolsBody").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-tool]");
      if (!btn || toolsBusy) return;
      const t = TOOLS.find((x) => x.id === btn.dataset.tool);
      if (!t) return;
      const c = toolCtx();
      if (t.need(c)) return;
      if (t.confirm && !window.confirm(t.confirm(c))) return;
      log("Ferramentas: " + t.title);
      if (t.inline) { t.run(c); return; }              // abre por cima da tela (o painel de status do host)
      if (t.leave) { closeToolsView(); t.run(c); return; }
      runTool(t.id, (msg) => t.run(msg, c));
    });
    // a porta nova que o navegador ainda não autorizou (S2 depois do reset)
    $("toolsMsg").addEventListener("click", async (e) => {
      const b = e.target.closest("[data-pend]");
      if (!b || !toolsPending || toolsBusy) return;
      const pend = toolsPending;
      let port = null;
      try { port = await requestPort(pend.filters); } catch (err) { toolsMsg(esc(err.message), "is-warn"); return; }
      if (!port) return;   // janela fechada: o botão continua lá
      await runTool(pend.id, (msg) => pend.run(port, msg), pend);
    });

    // ══════════════════════════════════════════════════════════════════
    // recomeço / erro / eventos
    // ══════════════════════════════════════════════════════════════════
    async function resetAll() {
      await closeCtl(); await disconnectEsp();
      S.device = null; S.lastPortInfo = null; S.info = null; S.chipKey = null; S.images = null;
      if (S.pendingBackup) S.recoveredBackup = S.pendingBackup;   // continua disponível em "Baixar backup guardado"
      S.pendingBackup = null; S.pendingBackupId = null; S.flashTouched = false; S.retryFromRom = false; S.manualDisconnect = false;
      S.host = freshHost();
      S.beforePorts = []; S.badPorts = new Set();
      S.eraseOnce = false; S.host.direct = false; toolsPending = null;
      screenConnect();
      autoDetect();
    }
    async function retryAfterError() {
      await disconnectEsp();
      S.manualDisconnect = false;
      if (S.hostFailed) {
        // A controladora já está pronta: só o host é refeito. Gravação que
        // parou no meio deixou o host no ROM (enquanto a BFMiDi estiver
        // ligada): a retomada pula o comando e aceita a porta já autorizada.
        S.hostFailed = false;
        S.busy = true;
        await hostStage({ recovering: S.host.inRom || !!S.host.direct });
        if (S.hostFailed) return;
        S.busy = false;
        screenDone();
        return;
      }
      await closeCtl();
      if (S.retryFromRom) {
        // A controladora pode estar parada no ROM: a porta autorizada (ou uma
        // nova) é retomada no passo da gravação, sem repetir backup.
        S.retryFromRom = false;
        screenAwaitPort();
        setCopy({ title: "Vamos <em>tentar de novo</em>", desc: "Se a tela da controladora está apagada, ela continua em modo de gravação: clique abaixo e escolha a porta. Se a tela acendeu, desligue e ligue o cabo e clique também — o fluxo recomeça pela identificação." });
        setActions([
          { label: "Escolher a porta e gravar", icon: "usb", pulse: true, onClick: () => continueAfterReset(true) },
          { label: "Recomeçar do início", kind: "ghost", onClick: () => resetAll() },
        ]);
        return;
      }
      S.device = null; S.lastPortInfo = null; S.info = null;
      screenConnect();
      autoDetect();
    }

    // Controladora já autorizada e conectada: identifica sem clique.
    async function autoDetect() {
      if (S.mode !== "idle" || S.manualDisconnect || S.busy) return;
      const port = await findGrantedPort();
      if (port) { log("Controladora autorizada encontrada — identificando."); connectFlow(false); }
    }

    const lib = serialLib();
    if (lib && lib.addEventListener) {
      lib.addEventListener("connect", (e) => {
        if (S.mode === "idle" && !S.busy) { S.manualDisconnect = false; autoDetect(); }
      });
      lib.addEventListener("disconnect", async (e) => {
        if (toolsBusy) return;   // uma ferramenta está no meio de um reset: ela mesma cuida da porta
        if (S.step === "host" && S.device && e.target === S.device) { S.host.ctlLost = true; log("A porta DEVICE caiu durante o passo do USB Host."); return; }
        if ((S.mode === "ready" || S.mode === "reading") && S.device && e.target === S.device) {
          closeHostDialog();
          log("A controladora foi desconectada.");
          await closeCtl();
          S.device = null; S.lastPortInfo = null; S.info = null;
          screenConnect("A controladora foi desconectada. Ligue o cabo de novo pra continuar.");
        }
      });
    }

    // Backup de uma sessão anterior (F5 no meio do fluxo): NUNCA é injetado —
    // pode ser de outra controladora. Só serve para baixar.
    AB.loadStashedBackup().then((rec) => {
      if (!rec) return;
      S.recoveredBackup = rec.obj;
      els.dl.hidden = false;
      log(`Backup de ${new Date(rec.at).toLocaleString()} recuperado do navegador — use "Baixar backup guardado".`);
    }).catch(() => { });
    els.dl.addEventListener("click", () => { const o = S.pendingBackup || S.recoveredBackup; if (o) AB.downloadBackup(o); });

    // Start Packs via blob: o GitHub Pages manda application/json e alguns
    // navegadores ABREM o JSON em vez de baixar.
    document.addEventListener("click", async (e) => {
        const a = e.target && e.target.closest ? e.target.closest("[data-pack]") : null;
        if (!a) return;
        e.preventDefault();
        const url = a.getAttribute("href"), name = a.getAttribute("download") || url.split("/").pop();
        try {
          const res = await fetch(url); if (!res.ok) throw new Error("HTTP " + res.status);
          const obj = URL.createObjectURL(await res.blob());
          const tmp = document.createElement("a"); tmp.href = obj; tmp.download = name;
          document.body.appendChild(tmp); tmp.click(); tmp.remove();
          setTimeout(() => URL.revokeObjectURL(obj), 2000);
        } catch (err) { log("Falha no download (" + name + "): " + err.message); window.location.href = url; }
    });

    // botões redondos da placa de status (um item por vez)
    els.frame.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b || S.mode !== "ready" || S.busy) return;
      if (b.dataset.act === "ctrl") startUpdate({ hostToo: false });
      else if (b.dataset.act === "host") startHostOnly();
    });

    // ── início ──
    log("User Agent: " + navigator.userAgent);
    setRail(S.rail);
    await Promise.all([loadManifest(), loadHostManifest()]);
    if (!serialLib()) {
      screenNeedBrowser();
    } else {
      screenConnect();
      autoDetect();
    }
  </script>
</body>

</html>
